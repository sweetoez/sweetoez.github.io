<div class="win-taskbar win-acrylic-light" aria-label="Windows taskbar">
  <span class="win-noise" aria-hidden="true"></span>
  <div class="win-taskbar__left">
    <img class="win-icon win-icon--24" src="../assets/images/windows/weather-sunny.png" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'">
    <div class="win-taskbar__weather-copy"><span>42°F</span><span>Mostly sunny</span></div>
  </div>
  <div class="win-taskbar__center" aria-label="Pinned apps">
    <button class="win-taskbar__button win-taskbar__start" type="button" aria-label="Start"><span class="win-icon win-icon--24" data-icon="grid" aria-hidden="true"></span><img class="win-taskbar__image" src="../assets/images/windows/taskbar/start.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'"></button>
    <div class="win-taskbar__search-wrap"><button class="win-taskbar__search" type="button" aria-label="Search"><span class="win-icon win-icon--16" data-icon="search" aria-hidden="true"></span><span>Search</span><img class="win-taskbar__search-highlight" src="../assets/images/windows/taskbar/search-highlight.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'"></button></div>
    <button class="win-taskbar__button" type="button" aria-label="Task view"><span class="win-icon win-icon--24" data-icon="windowMultiple" aria-hidden="true"></span><img class="win-taskbar__image" src="../assets/images/windows/taskbar/task-view.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'"></button>
    <button class="win-taskbar__button win-taskbar__app" type="button" aria-label="Copilot"><span class="win-icon win-icon--24 win-taskbar__fallback" data-icon="sparkle" aria-hidden="true"></span><img class="win-taskbar__image" src="../assets/images/windows/taskbar/copilot.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'"></button>
    <button class="win-taskbar__button win-taskbar__app" type="button" aria-label="File Explorer"><span class="win-icon win-icon--24 win-taskbar__fallback" data-icon="folder" aria-hidden="true"></span><img class="win-taskbar__image" src="../assets/images/windows/taskbar/explorer.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'"></button>
    <button class="win-taskbar__button win-taskbar__app" type="button" aria-label="Browser"><span class="win-icon win-icon--24 win-taskbar__fallback" data-icon="globe" aria-hidden="true"></span><img class="win-taskbar__image" src="../assets/images/windows/taskbar/edge.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'"></button>
    <button class="win-taskbar__button win-taskbar__app" type="button" aria-label="Store"><span class="win-icon win-icon--24 win-taskbar__fallback" data-icon="buildingShop" aria-hidden="true"></span><img class="win-taskbar__image" src="../assets/images/windows/taskbar/store.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'"></button>
    <button class="win-taskbar__button win-taskbar__app" type="button" aria-label="Recall"><span class="win-icon win-icon--24 win-taskbar__fallback" data-icon="chatSparkle" aria-hidden="true"></span><img class="win-taskbar__image" src="../assets/images/windows/taskbar/recall.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'"></button>
    <button class="win-taskbar__button win-taskbar__app" type="button" aria-label="Outlook"><span class="win-icon win-icon--24 win-taskbar__fallback" data-icon="mail" aria-hidden="true"></span><img class="win-taskbar__image" src="../assets/images/windows/taskbar/outlook.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'"></button>
    <button class="win-taskbar__button win-taskbar__app" type="button" aria-label="Teams"><span class="win-icon win-icon--24 win-taskbar__fallback" data-icon="people" aria-hidden="true"></span><img class="win-taskbar__image" src="../assets/images/windows/taskbar/teams.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'"></button>
  </div>
  <div class="win-taskbar__right">
    <div class="win-taskbar__status" role="group" aria-label="System status">
      <span class="win-icon win-taskbar__tray-icon" role="img" aria-label="Show hidden icons"><svg width="32" height="48" viewBox="0 0 32 48" fill="none" aria-hidden="true"><path d="M10.6641 26C10.6641 25.8177 10.7292 25.6615 10.8594 25.5312L15.5312 20.8594C15.6615 20.7292 15.8177 20.6641 16 20.6641C16.1823 20.6641 16.3385 20.7292 16.4688 20.8594L21.1406 25.5312C21.2708 25.6615 21.3359 25.8177 21.3359 26C21.3359 26.1875 21.2682 26.3464 21.1328 26.4766C21.0026 26.6016 20.8464 26.6641 20.6641 26.6641C20.4818 26.6641 20.3255 26.599 20.1953 26.4688L16 22.2734L11.8047 26.4688C11.6745 26.599 11.5182 26.6641 11.3359 26.6641C11.1536 26.6641 10.9948 26.6016 10.8594 26.4766C10.7292 26.3464 10.6641 26.1875 10.6641 26Z" fill="currentColor"/></svg></span>
      <img class="win-taskbar__tray-icon" src="../assets/images/windows/taskbar/tray-onedrive.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'">
      <img class="win-taskbar__tray-icon win-taskbar__recall-light" src="../assets/images/windows/taskbar/tray-recall.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'">
      <img class="win-taskbar__tray-icon win-taskbar__recall-dark" src="../assets/images/windows/taskbar/tray-recall-dark.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'">
      <img class="win-taskbar__quick-settings" src="../assets/images/windows/taskbar/tray-quick-settings.svg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'">
    </div>
    <div class="win-taskbar__clock"><span>11:30 AM</span><span>11/19/2026</span></div>
  </div>
</div>
