<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Knowledge Card — Mobile</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/travel-map.js"></script>
  <script src="../assets/js/components/kc-modules/utility.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; }
    .kc-company-mobile-frame { height:auto; min-height:2100px; padding-bottom:109px; }
    .kc-company-mobile { position:relative; top:auto; left:auto; width:360px; margin:280px 0 0 403px; }
    .kc-company-mobile .kc-mobile-designer { height:362px; }
    .kc-company-mobile .kc-mobile-designer__top-actions svg { display:block; width:12px; height:12px; flex:none; color:var(--kc-white); }
    .kc-company-mobile .kc-mobile-hero-text-list { height:150px; }
    .kc-company-mobile .kc-mobile-hero-tabs { border-radius:100px 0 0 100px; }
    .kc-company-mobile .kc-mobile-hero-tabs-container { width:max-content; }
    .kc-company-mobile .kc-mobile-hero-tab { background:var(--kc-accent-soft); color:var(--kc-accent); }
    .kc-company-mobile .kc-mobile-hero-tab--selected { background:var(--kc-accent); color:var(--kc-white); }
    .kc-company-mobile .kc-mobile-hero-tab:not(.kc-mobile-hero-tab--selected):hover { background:var(--kc-accent-soft); filter:brightness(.96); }
    .kc-company-mobile .kc-mobile-hero-tab:not(.kc-mobile-hero-tab--selected):active { background:var(--kc-accent-soft); filter:brightness(.92); }
    .kc-company-mobile .kc-mobile-hero-tab--selected:hover { background:var(--kc-accent); filter:brightness(.96); }
    .kc-company-mobile .kc-mobile-hero-tab--selected:active { background:var(--kc-accent); filter:brightness(.92); }
    .kc-company-mobile .kc-mobile-hero-text p { width:319px; height:54px; margin:0; }
    .kc-company-mobile .kc-mobile-text-list-quick-facts { height:186px; }
    .kc-company-mobile .kc-mobile-text-list-quick-facts__fact:nth-child(3) > span:last-child { color:var(--kc-accent); }
    .kc-company-mobile .kc-mobile-text-list-quick-facts__fact[data-extra-fact] { height:18px; }
    .kc-company-mobile .kc-mobile-text-list-quick-facts__fact[hidden],
    .kc-company-mobile .kc-mobile-text-list-quick-facts__line[hidden] { display:none; }
    .kc-company-mobile .kc-company-mobile__quick-facts-expanded { height:auto; min-height:186px; }
    .kc-company-mobile .kc-company-mobile__quick-facts-expanded .kc-mobile-text-list-quick-facts__more svg { transform:rotate(180deg); }
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image { height:348px; }
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image .kc-mobile-image-list-interesting-facts__row:first-child { height:167px; }
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image .kc-mobile-image-list-interesting-facts__row:first-child .kc-img { width:104px; height:109px; }
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image .kc-mobile-image-list-interesting-facts__row:last-child { height:133px; align-items:center; }
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image .kc-mobile-image-list-interesting-facts__row:last-child .kc-img { width:106px; height:99px; }
    .kc-company-mobile .kc-mobile-miscellaneous-timeline__list { height:auto; margin:0; padding:0; list-style:none; }
    .kc-company-mobile .kc-mobile-miscellaneous-timeline__entry { height:auto; align-items:stretch; }
    .kc-company-mobile .kc-mobile-miscellaneous-timeline__rail { height:auto; min-height:28px; }
    .kc-company-mobile .kc-mobile-miscellaneous-timeline__rail::before { height:calc(100% - 1px); background:var(--kc-accent); }
    .kc-company-mobile .kc-mobile-miscellaneous-timeline__rail::after { border-color:var(--kc-accent); }
    .kc-company-mobile .kc-mobile-miscellaneous-timeline__content { height:auto; }
    .kc-company-mobile .kc-mobile-miscellaneous-timeline__year { color:var(--kc-accent); }
    .kc-company-mobile .kc-mobile-miscellaneous-timeline__quote { font-weight:400; }
    .kc-company-mobile .kc-mobile-text-list-attribution { height:79px; }
    .kc-company-mobile > .kc-card-more .kc-module--mobile { margin-top:-1px; }
    .kc-company-mobile .kc-module--mobile { border-radius:0; }
    .kc-company-mobile .kc-module--mobile[hidden] { display:none !important; }
    .kc-company-mobile .kc-module--card-last { border-radius:0 0 6px 6px; }
    .kc-company-mobile > .kc-mobile-expansion-see-more { margin-top:-1px; }
    .kc-company-mobile .kc-mobile-expansion-see-more__circle { background:var(--kc-accent); color:var(--kc-white); }
    .kc-company-mobile .kc-mobile-expansion-see-more__circle svg { position:absolute; top:13px; left:12px; display:block; width:16px; height:16px; }
    .kc-company-mobile .kc-mobile-expansion-see-more:active { transform:scale(.98); }
    .kc-company-mobile .kc-mobile-expansion-see-more:focus-visible { outline:2px solid #272320; outline-offset:2px; }
    .kc-company-mobile { --kc-accent:#1B6AC7; --kc-accent-soft:#F5F9FD; }
    .kc-company-mobile .kc-mobile-designer--top-to-bottom { height:442px; }
    .kc-company-mobile .kc-mobile-hero-text-list { height:230px; }
    .kc-company-mobile .kc-mobile-hero-tab:first-child { width:auto; }
    .kc-company-mobile .kc-mobile-hero-tab { width:auto; }
    .kc-company-mobile .kc-mobile-hero-text { width:344px; height:166px; flex-direction:column; gap:12px; }
    .kc-company-mobile .kc-mobile-hero-text p { height:90px; -webkit-line-clamp:5; line-clamp:5; }
    .kc-company-mobile .kc-mobile-hero-website { width:327px; }
    .kc-company-mobile .kc-mobile-hero-website__globe { background-color:var(--kc-accent); }
    .kc-company-mobile .kc-mobile-hero-website a { color:var(--kc-accent); }
    .kc-company-mobile .kc-mobile-text-list-top-fact--2 { height:100px; padding:0 16px; align-items:center; }
    .kc-company-mobile .kc-mobile-text-list-top-fact__item { height:auto; width:147px; flex:none; }
    .kc-company-mobile .kc-mobile-text-list-top-fact > .kc-divider--v { height:100px; align-self:center; }
    .kc-company-mobile .kc-company-mobile__value-tall { min-height:48px; }
    .kc-company-mobile .kc-mobile-text-list-quick-facts__fact:nth-child(1) > span:last-child,
    .kc-company-mobile .kc-mobile-text-list-quick-facts__fact:nth-child(7) > span:last-child { color:var(--kc-accent); }
    .kc-company-mobile .kc-mobile-text-list-quick-facts__fact:nth-child(3) > span:last-child { color:var(--kc-gray-1); }
    .kc-company-mobile .kc-mobile-text-list-quick-facts__more svg { transition:none; }
    .kc-company-mobile .kc-company-mobile__expanded .kc-mobile-text-list-quick-facts__more svg { transform:rotate(180deg); }
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image { height:auto; }
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image .kc-mobile-image-list-interesting-facts__row:first-child,
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image .kc-mobile-image-list-interesting-facts__row:last-child { height:auto; }
    .kc-company-mobile .kc-mobile-image-list-interesting-facts__row + .kc-mobile-image-list-interesting-facts__row { margin-top:16px; }
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image .kc-mobile-image-list-interesting-facts__text,
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image .kc-mobile-image-list-interesting-facts__text p { width:auto; height:auto; }
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image .kc-mobile-image-list-interesting-facts__text { flex:1 1 0; min-width:0; }
    .kc-company-mobile .kc-mobile-image-list-interesting-facts--2-image .kc-mobile-image-list-interesting-facts__row .kc-img { width:104px; height:109px; flex:none; }
    .kc-company-mobile .kc-mobile-miscellaneous-quote { height:auto; min-height:131px; }
    .kc-company-mobile .kc-mobile-miscellaneous-quote__frame { height:auto; min-height:99px; }
    .kc-company-mobile .kc-mobile-miscellaneous-quote__text { position:static; width:307px; height:auto; min-height:88px; margin:4px 0 0 12px; padding-bottom:20px; }
    .kc-company-mobile .kc-mobile-miscellaneous-quote__glyph--close { top:auto; bottom:0; }
    .kc-company-mobile .kc-mobile-miscellaneous-timeline { height:auto; }
    .kc-company-mobile .kc-mobile-miscellaneous-timeline__entry:last-child .kc-mobile-miscellaneous-timeline__rail::before { display:none; }
    .kc-company-mobile .kc-mobile-text-list-attribution { height:auto; }
    .kc-company-mobile .kc-mobile-miscellaneous-quote__glyph { color:var(--kc-accent-soft); }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <h1 class="kc-card-board-label">Company — Mobile</h1>
      <div class="kc-full-knowledge-card kc-company-mobile-frame" data-kc="Full Knowledge Card">
        <article class="kc-card-stack kc-mobile-designer-card kc-company-mobile" data-kc="Segment / Company" aria-label="Microsoft knowledge card">
          <kc-hero entity="company" platform="mobile"></kc-hero>

          <kc-module entity="company" platform="mobile" index="0"></kc-module>

          <kc-module entity="company" platform="mobile" index="1"></kc-module>

          <div class="kc-card-more" id="kc-company-mobile-more" hidden>
            <kc-module entity="company" platform="mobile" index="2"></kc-module>

            <kc-module entity="company" platform="mobile" index="3"></kc-module>

            <kc-module entity="company" platform="mobile" index="4"></kc-module>

            <kc-module entity="company" platform="mobile" index="5"></kc-module>
          </div>
          <button class="kc-mobile-expansion-see-more" type="button" data-kc="Mobile / Expansion / See more" aria-expanded="false" aria-controls="kc-company-mobile-more">
            <span class="kc-mobile-expansion-see-more__line" aria-hidden="true"></span>
            <span class="kc-mobile-expansion-see-more__circle" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.14645 5.14645C3.34171 4.95118 3.65829 4.95118 3.85355 5.14645L8 9.29289L12.1464 5.14645C12.3417 4.95118 12.6583 4.95118 12.8536 5.14645C13.0488 5.34171 13.0488 5.65829 12.8536 5.85355L8.35355 10.3536C8.15829 10.5488 7.84171 10.5488 7.64645 10.3536L3.14645 5.85355C2.95118 5.65829 2.95118 5.34171 3.14645 5.14645Z" fill="currentColor"/></svg></span>
            <span class="kc-mobile-expansion-see-more__label">See more</span>
          </button>
        </article>
      </div>
    </div>
  </main>
  <script>
    const stack = document.querySelector(".kc-company-mobile");
    const quickFacts = stack.querySelector("#kc-company-mobile-quick-facts");
    const quickFactsButton = quickFacts.querySelector(".kc-mobile-text-list-quick-facts__more button");
    const cardExpansion = stack.querySelector(".kc-mobile-expansion-see-more");
    const cardMore = document.getElementById("kc-company-mobile-more");
    const cardExpansionLabel = cardExpansion.querySelector(".kc-mobile-expansion-see-more__label");
    const tablist = stack.querySelector(".kc-mobile-hero-tabs-container");

    function selectTab(tab, focus = false) {
      const tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
      for (const item of tabs) {
        const selected = item === tab;
        item.classList.toggle("kc-mobile-hero-tab--selected", selected);
        item.setAttribute("aria-selected", String(selected));
        item.tabIndex = selected ? 0 : -1;
      }
      if (focus) tab.focus();
    }

    function setExpanded(expanded) {
      cardMore.hidden = !expanded;
      cardExpansion.setAttribute("aria-expanded", String(expanded));
      cardExpansionLabel.textContent = expanded ? "See less" : "See more";
      quickFactsButton.setAttribute("aria-expanded", String(expanded));
      quickFactsButton.textContent = expanded ? "See less" : "See more";
      quickFacts.classList.toggle("kc-company-mobile__expanded", expanded);
    }

    tablist.addEventListener("click", event => {
      const tab = event.target.closest('[role="tab"]');
      if (tab && tablist.contains(tab)) selectTab(tab);
    });
    tablist.addEventListener("keydown", event => {
      const tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
      const activeIndex = tabs.indexOf(document.activeElement);
      const nextIndex = event.key === "ArrowRight" ? (activeIndex + 1) % tabs.length
        : event.key === "ArrowLeft" ? (activeIndex - 1 + tabs.length) % tabs.length
        : event.key === "Home" ? 0
        : event.key === "End" ? tabs.length - 1
        : -1;
      if (nextIndex < 0) return;
      event.preventDefault();
      selectTab(tabs[nextIndex], true);
    });

    cardExpansion.addEventListener("click", () => setExpanded(cardExpansion.getAttribute("aria-expanded") !== "true"));
    quickFactsButton.addEventListener("click", () => setExpanded(quickFactsButton.getAttribute("aria-expanded") !== "true"));
  </script>
</body>
</html>
