<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingredient Knowledge Card — Mobile</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/travel-map.js"></script>
  <script src="../assets/js/components/kc-modules/media.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <script src="../assets/js/components/kc-card.js"></script>
  <script src="../assets/js/kc-mobile-carousels.js" defer></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; font-weight:400; }

    .kc-ingredient-mobile-frame { height:auto; min-height:1950px; padding-bottom:109px; }
    .kc-ingredient-mobile { position:relative; top:auto; left:auto; width:360px; margin:280px 0 0 403px; }
    .kc-ingredient-mobile .kc-mobile-designer { height:362px; }
    .kc-ingredient-mobile .kc-mobile-designer__top-actions svg { display:block; width:12px; height:12px; flex:none; color:var(--kc-white); }
    .kc-ingredient-mobile .kc-mobile-hero-text-list { height:150px; }
    .kc-ingredient-mobile .kc-mobile-hero-tabs { border-radius:100px 0 0 100px; }
    .kc-ingredient-mobile .kc-mobile-hero-tabs-container { width:max-content; }
    .kc-ingredient-mobile .kc-mobile-hero-tab { background:var(--kc-accent-soft); color:var(--kc-accent-foreground, var(--kc-accent)); }
    .kc-ingredient-mobile .kc-mobile-hero-tab--selected { background:var(--kc-accent); color:var(--kc-white); }
    .kc-ingredient-mobile .kc-mobile-hero-tab:not(.kc-mobile-hero-tab--selected):hover { background:var(--kc-accent-soft); filter:brightness(.96); }
    .kc-ingredient-mobile .kc-mobile-hero-tab:not(.kc-mobile-hero-tab--selected):active { background:var(--kc-accent-soft); filter:brightness(.92); }
    .kc-ingredient-mobile .kc-mobile-hero-tab--selected:hover { background:var(--kc-accent); filter:brightness(.96); }
    .kc-ingredient-mobile .kc-mobile-hero-tab--selected:active { background:var(--kc-accent); filter:brightness(.92); }
    .kc-ingredient-mobile .kc-mobile-hero-text p { width:319px; height:54px; margin:0; font-weight:600; }

    .kc-ingredient-mobile .kc-module--mobile { border-radius:0; }
    .kc-ingredient-mobile .kc-module--card-last { border-radius:0 0 6px 6px; }
    .kc-ingredient-mobile > .kc-card-more .kc-module--mobile { margin-top:-1px; }
    .kc-ingredient-mobile > .kc-mobile-expansion-see-more { margin-top:-1px; }

    .kc-ingredient-mobile .kc-module--mobile .kc-scroll-row {
      display:flex; width:100%; margin:0; padding:0 0 0 16px; gap:8px;
      scroll-snap-type:x proximity; scroll-padding-left:16px; clip-path:none;
    }
    .kc-ingredient-mobile .kc-module--mobile .kc-scroll-row > * { flex:none; justify-self:auto; scroll-snap-align:start; }
    .kc-ingredient-mobile .kc-scroll-row:focus-visible { outline:2px solid #272320; outline-offset:-2px; }
    .kc-ingredient-mobile .kc-btn-flipper:active { transform:scale(.98); }
    .kc-ingredient-mobile .kc-btn-flipper:focus-visible { outline:2px solid #272320; outline-offset:2px; }
    .kc-ingredient-mobile .kc-btn-flipper:disabled { opacity:.4; cursor:not-allowed; }

    .kc-ingredient-mobile .kc-mobile-image-list-carousel { height:152px; overflow:hidden; padding:16px 0; }
    .kc-ingredient-mobile .kc-mobile-image-list-carousel .kc-scroll-row { gap:8px; }
    .kc-ingredient-mobile .kc-ingredient-mobile-carousel__previous { position:absolute; z-index:2; top:60px; left:8px; }
    .kc-ingredient-mobile .kc-ingredient-mobile-carousel__next { position:absolute; z-index:2; top:60px; right:8px; }

    .kc-ingredient-mobile .kc-mobile-miscellaneous-serving-size__circle { background:var(--kc-accent-soft); }
    .kc-ingredient-mobile .kc-mobile-miscellaneous-serving-size .kc-module-title h3 { color:var(--kc-gray-1); }

    .kc-ingredient-mobile .kc-module--mobile.kc-mobile-videos-landscape { height:313px; overflow:hidden; }
    .kc-ingredient-mobile .kc-mobile-videos-landscape .kc-scroll-row { width:360px; margin:0 -16px; }
    .kc-ingredient-mobile .kc-mobile-video__play svg { width:24px; height:24px; color:var(--kc-white); }
    .kc-ingredient-mobile .kc-mobile-scroll-control { top:calc(50% + 17px); }

    .kc-ingredient-mobile .kc-mobile-image-list-ingredients { height:102px; }
    .kc-ingredient-mobile .kc-mobile-image-list-ingredients__list { gap:0; }
    .kc-ingredient-mobile .kc-mobile-image-list-ingredients__row { height:36px; }
    .kc-ingredient-mobile .kc-mobile-image-list-ingredients__item { height:36px; }
    .kc-ingredient-mobile .kc-mobile-image-list-ingredients__item .kc-m-bold { flex:1; }

    .kc-ingredient-mobile .kc-mobile-text-list-attribution { height:79px; }
    .kc-ingredient-mobile .kc-mobile-expansion-see-more__circle { background:var(--kc-accent); color:var(--kc-white); }
    .kc-ingredient-mobile .kc-mobile-expansion-see-more__circle svg { position:absolute; top:13px; left:12px; display:block; width:16px; height:16px; }
    .kc-ingredient-mobile .kc-mobile-expansion-see-more:active { transform:scale(.98); }
    .kc-ingredient-mobile .kc-mobile-expansion-see-more:focus-visible { outline:2px solid #272320; outline-offset:2px; }
    @media (prefers-reduced-motion:reduce) { .kc-ingredient-mobile .kc-scroll-row { scroll-behavior:auto; } }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <h1 class="kc-card-board-label">Ingredient — Mobile</h1>
      <div class="kc-full-knowledge-card kc-ingredient-mobile-frame" data-kc="Full Knowledge Card">
        <kc-card entity="ingredient" platform="mobile"></kc-card>
      </div>
    </div>
  </main>

</body>
</html>
