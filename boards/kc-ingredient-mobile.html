<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingredient Knowledge Card — Mobile</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/media.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <script src="../assets/js/kc-mobile-carousels.js" defer></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; font-weight:400; }

    .kc-ingredient-mobile-frame { height:auto; min-height:1950px; padding-bottom:109px; }
    .kc-ingredient-mobile { position:relative; top:auto; left:auto; width:360px; margin:280px 0 0 403px; }
    .kc-ingredient-mobile .kc-mobile-designer { height:362px; }
    .kc-ingredient-mobile .kc-mobile-designer__top-actions svg { display:block; width:12px; height:12px; flex:none; color:var(--kc-white); }
    .kc-ingredient-mobile .kc-mobile-hero-text-list { height:150px; }
    .kc-ingredient-mobile .kc-mobile-hero-tabs { border-radius:100px 0 0 100px; }
    .kc-ingredient-mobile .kc-mobile-hero-tabs-container { width:max-content; }
    .kc-ingredient-mobile .kc-mobile-hero-tab { background:var(--kc-accent-soft); color:var(--kc-accent); }
    .kc-ingredient-mobile .kc-mobile-hero-tab--selected { background:var(--kc-accent); color:var(--kc-white); }
    .kc-ingredient-mobile .kc-mobile-hero-tab:not(.kc-mobile-hero-tab--selected):hover { background:var(--kc-accent-soft); filter:brightness(.96); }
    .kc-ingredient-mobile .kc-mobile-hero-tab:not(.kc-mobile-hero-tab--selected):active { background:var(--kc-accent-soft); filter:brightness(.92); }
    .kc-ingredient-mobile .kc-mobile-hero-tab--selected:hover { background:var(--kc-accent); filter:brightness(.96); }
    .kc-ingredient-mobile .kc-mobile-hero-tab--selected:active { background:var(--kc-accent); filter:brightness(.92); }
    .kc-ingredient-mobile .kc-mobile-hero-text p { width:319px; height:54px; margin:0; font-weight:600; }

    .kc-ingredient-mobile .kc-module--mobile { border-radius:0; }
    .kc-ingredient-mobile .kc-module--card-last { border-radius:0 0 6px 6px; }
    .kc-ingredient-mobile > .kc-card-more .kc-module--mobile { margin-top:-1px; }
    .kc-ingredient-mobile > .kc-mobile-expansion-see-more { margin-top:-1px; }

    .kc-ingredient-mobile .kc-module--mobile .kc-scroll-row {
      display:flex; width:100%; margin:0; padding:0 0 0 16px; gap:8px;
      scroll-snap-type:x proximity; scroll-padding-left:16px; clip-path:none;
    }
    .kc-ingredient-mobile .kc-module--mobile .kc-scroll-row > * { flex:none; justify-self:auto; scroll-snap-align:start; }
    .kc-ingredient-mobile .kc-scroll-row:focus-visible { outline:2px solid #272320; outline-offset:-2px; }
    .kc-ingredient-mobile .kc-btn-flipper:active { transform:scale(.98); }
    .kc-ingredient-mobile .kc-btn-flipper:focus-visible { outline:2px solid #272320; outline-offset:2px; }
    .kc-ingredient-mobile .kc-btn-flipper:disabled { opacity:.4; cursor:not-allowed; }

    .kc-ingredient-mobile .kc-mobile-image-list-carousel { height:152px; overflow:hidden; padding:16px 0; }
    .kc-ingredient-mobile .kc-mobile-image-list-carousel .kc-scroll-row { gap:8px; }
    .kc-ingredient-mobile .kc-ingredient-mobile-carousel__previous { position:absolute; z-index:2; top:60px; left:8px; }
    .kc-ingredient-mobile .kc-ingredient-mobile-carousel__next { position:absolute; z-index:2; top:60px; right:8px; }

    .kc-ingredient-mobile .kc-mobile-miscellaneous-serving-size__circle { background:var(--kc-accent-soft); }
    .kc-ingredient-mobile .kc-mobile-miscellaneous-serving-size .kc-module-title h3 { color:var(--kc-gray-1); }

    .kc-ingredient-mobile.kc-card-stack .kc-module.kc-mobile-image-list-interesting-facts { height:338px; }
    .kc-ingredient-mobile.kc-card-stack .kc-module.kc-mobile-image-list-interesting-facts .kc-mobile-image-list-interesting-facts__row:nth-child(1) { height:193px; align-items:flex-start; }
    .kc-ingredient-mobile.kc-card-stack .kc-module.kc-mobile-image-list-interesting-facts .kc-mobile-image-list-interesting-facts__row:nth-child(2) { height:97px; align-items:center; }
    .kc-ingredient-mobile.kc-card-stack .kc-module.kc-mobile-image-list-interesting-facts .kc-mobile-image-list-interesting-facts__row:nth-child(1) .kc-mobile-image-list-interesting-facts__text { width:203px; height:193px; flex:none; gap:16px; }
    .kc-ingredient-mobile.kc-card-stack .kc-module.kc-mobile-image-list-interesting-facts .kc-mobile-image-list-interesting-facts__row:nth-child(2) .kc-mobile-image-list-interesting-facts__text { width:181px; height:97px; flex:none; gap:16px; text-align:right; }
    .kc-ingredient-mobile.kc-card-stack .kc-module.kc-mobile-image-list-interesting-facts .kc-mobile-image-list-interesting-facts__row:nth-child(1) .kc-img { width:104px; height:76px; }
    .kc-ingredient-mobile.kc-card-stack .kc-module.kc-mobile-image-list-interesting-facts .kc-mobile-image-list-interesting-facts__row:nth-child(2) .kc-img { width:126px; height:93px; }
    .kc-ingredient-mobile.kc-card-stack .kc-module.kc-mobile-image-list-interesting-facts .kc-mobile-image-list-interesting-facts__row:nth-child(n) .kc-mobile-image-list-interesting-facts__text p { display:flex; width:100%; height:80px; align-items:center; }
    .kc-ingredient-mobile.kc-card-stack .kc-module.kc-mobile-image-list-interesting-facts .kc-mobile-image-list-interesting-facts__row:nth-child(2) .kc-mobile-image-list-interesting-facts__text p { justify-content:flex-end; }

    .kc-ingredient-mobile .kc-module--mobile.kc-mobile-videos-landscape { height:313px; overflow:hidden; }
    .kc-ingredient-mobile .kc-mobile-videos-landscape .kc-scroll-row { width:360px; margin:0 -16px; }
    .kc-ingredient-mobile .kc-mobile-video__play svg { width:24px; height:24px; color:var(--kc-white); }
    .kc-ingredient-mobile .kc-mobile-scroll-control { top:calc(50% + 17px); }

    .kc-ingredient-mobile .kc-mobile-image-list-ingredients { height:102px; }
    .kc-ingredient-mobile .kc-mobile-image-list-ingredients__list { gap:0; }
    .kc-ingredient-mobile .kc-mobile-image-list-ingredients__row { height:36px; }
    .kc-ingredient-mobile .kc-mobile-image-list-ingredients__item { height:36px; }
    .kc-ingredient-mobile .kc-mobile-image-list-ingredients__item .kc-m-bold { flex:1; }

    .kc-ingredient-mobile .kc-mobile-text-list-attribution { height:79px; }
    .kc-ingredient-mobile .kc-mobile-expansion-see-more__circle { background:var(--kc-accent); color:var(--kc-white); }
    .kc-ingredient-mobile .kc-mobile-expansion-see-more__circle svg { position:absolute; top:13px; left:12px; display:block; width:16px; height:16px; }
    .kc-ingredient-mobile .kc-mobile-expansion-see-more:active { transform:scale(.98); }
    .kc-ingredient-mobile .kc-mobile-expansion-see-more:focus-visible { outline:2px solid #272320; outline-offset:2px; }
    @media (prefers-reduced-motion:reduce) { .kc-ingredient-mobile .kc-scroll-row { scroll-behavior:auto; } }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <h1 class="kc-card-board-label">Ingredient — Mobile</h1>
      <div class="kc-full-knowledge-card kc-ingredient-mobile-frame" data-kc="Full Knowledge Card">
        <article class="kc-card-stack kc-mobile-designer-card kc-ingredient-mobile kc-theme-green" data-kc="Segment / Ingredient" aria-label="Summer squash knowledge card">
          <kc-hero entity="ingredient" platform="mobile"></kc-hero>

          <kc-module entity="ingredient" platform="mobile" index="0"></kc-module>

          <section class="kc-module kc-module--mobile kc-mobile-miscellaneous-serving-size" id="kc-ingredient-mobile-serving-size" data-kc="Mobile / Miscellaneous / Serving Size" aria-labelledby="kc-ingredient-mobile-serving-title">
            <div class="kc-module-title"><h3 id="kc-ingredient-mobile-serving-title">Serving Size: Food (100g)</h3></div>
            <div class="kc-mobile-miscellaneous-serving-size__content">
              <div class="kc-mobile-miscellaneous-serving-size__circles">
                <div class="kc-mobile-miscellaneous-serving-size__circle">
                  <span class="kc-m-bold">Title</span>
                  <strong>000</strong>
                </div>
                <div class="kc-mobile-miscellaneous-serving-size__circle">
                  <span class="kc-m-bold">Title</span>
                  <strong>000</strong>
                  <span class="kc-m-foot">XX%</span>
                </div>
                <div class="kc-mobile-miscellaneous-serving-size__circle">
                  <span class="kc-m-bold">Title</span>
                  <strong>000</strong>
                </div>
                <div class="kc-mobile-miscellaneous-serving-size__circle">
                  <span class="kc-m-bold">Title</span>
                  <strong>000</strong>
                  <span class="kc-m-foot">XX%</span>
                </div>
              </div>
              <span class="kc-mobile-miscellaneous-serving-size__foot">% Daily value*</span>
            </div>
          </section>

          <kc-module entity="ingredient" platform="mobile" index="2"></kc-module>

          <kc-module entity="ingredient" platform="mobile" index="3"></kc-module>

          <kc-module entity="ingredient" platform="mobile" index="4"></kc-module>

          <div class="kc-card-more" id="kc-ingredient-mobile-more" hidden>
            <kc-module entity="ingredient" platform="mobile" index="5"></kc-module>
          </div>
          <button class="kc-mobile-expansion-see-more" type="button" data-kc="Mobile / Expansion / See more" aria-expanded="false" aria-controls="kc-ingredient-mobile-more">
            <span class="kc-mobile-expansion-see-more__line" aria-hidden="true"></span>
            <span class="kc-mobile-expansion-see-more__circle" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.14645 5.14645C3.34171 4.95118 3.65829 4.95118 3.85355 5.14645L8 9.29289L12.1464 5.14645C12.3417 4.95118 12.6583 4.95118 12.8536 5.14645C13.0488 5.34171 13.0488 5.65829 12.8536 5.85355L8.35355 10.3536C8.15829 10.5488 7.84171 10.5488 7.64645 10.3536L3.14645 5.85355C2.95118 5.65829 2.95118 5.34171 3.14645 5.14645Z" fill="currentColor"/></svg></span>
            <span class="kc-mobile-expansion-see-more__label">See more</span>
          </button>
        </article>
      </div>
    </div>
  </main>
  <script>
    const stack = document.querySelector(".kc-ingredient-mobile");
    const carousel = stack.querySelector("#kc-ingredient-mobile-carousel .kc-scroll-row");
    const previousCarousel = stack.querySelector(".kc-ingredient-mobile-carousel__previous");
    const nextCarousel = stack.querySelector(".kc-ingredient-mobile-carousel__next");
    const cardExpansion = stack.querySelector(".kc-mobile-expansion-see-more");
    const cardMore = document.getElementById("kc-ingredient-mobile-more");
    const cardExpansionLabel = cardExpansion.querySelector(".kc-mobile-expansion-see-more__label");
    const tablist = stack.querySelector(".kc-mobile-hero-tabs-container");

    function syncCarousel() {
      previousCarousel.disabled = carousel.scrollLeft <= 0;
      nextCarousel.disabled = carousel.scrollLeft + carousel.clientWidth >= carousel.scrollWidth - 1;
    }

    function scrollCarousel(direction) {
      const behavior = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth";
      carousel.scrollBy({ left:direction * 140, behavior });
    }

    function selectTab(tab, focus = false) {
      const tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
      for (const item of tabs) {
        const selected = item === tab;
        item.classList.toggle("kc-mobile-hero-tab--selected", selected);
        item.setAttribute("aria-selected", String(selected));
        item.tabIndex = selected ? 0 : -1;
      }
      if (focus) tab.focus();
    }

    previousCarousel.addEventListener("click", () => scrollCarousel(-1));
    nextCarousel.addEventListener("click", () => scrollCarousel(1));
    carousel.addEventListener("scroll", syncCarousel, { passive:true });
    carousel.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        scrollCarousel(event.key === "ArrowLeft" ? -1 : 1);
      }
    });
    window.addEventListener("resize", syncCarousel);

    tablist.addEventListener("click", event => {
      const tab = event.target.closest('[role="tab"]');
      if (tab && tablist.contains(tab)) selectTab(tab);
    });
    tablist.addEventListener("keydown", event => {
      const tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
      const activeIndex = tabs.indexOf(document.activeElement);
      const nextIndex = event.key === "ArrowRight" ? (activeIndex + 1) % tabs.length
        : event.key === "ArrowLeft" ? (activeIndex - 1 + tabs.length) % tabs.length
        : event.key === "Home" ? 0
        : event.key === "End" ? tabs.length - 1
        : -1;
      if (nextIndex < 0) return;
      event.preventDefault();
      selectTab(tabs[nextIndex], true);
    });

    cardExpansion.addEventListener("click", () => {
      const expanded = cardExpansion.getAttribute("aria-expanded") !== "true";
      cardMore.hidden = !expanded;
      cardExpansion.setAttribute("aria-expanded", String(expanded));
      cardExpansionLabel.textContent = expanded ? "See less" : "See more";
    });

    syncCarousel();
  </script>
</body>
</html>
