<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Knowledge Card — Desktop</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/travel-map.js"></script>
  <script src="../assets/js/components/kc-modules/utility.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <script src="../assets/js/components/kc-card.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; }

    .kc-food-desktop-frame { height:auto; min-height:1849px; padding-bottom:109px; }
    .kc-food-desktop > .kc-hero-designer--top-to-bottom { height:364px; }
    .kc-food-desktop .kc-hero .kc-text-list { height:84px; padding:32px 20px 16px; }
    .kc-food-desktop .kc-hero-body { height:36px; }
    .kc-food-desktop > .kc-hero-designer--card-last .kc-text-list { border-radius:0 0 6px 6px; }
    .kc-food-desktop .kc-miscellaneous-serving-size__label { font-weight:700; }
    .kc-food-desktop .kc-miscellaneous-serving-size__circle { background:var(--kc-accent-soft); justify-content:flex-start; }
    .kc-food-desktop .kc-miscellaneous-serving-size__circle:nth-child(-n+2) { justify-content:center; }
    .kc-food-desktop .kc-miscellaneous-serving-size__circle span:first-child { color:var(--kc-gray-1); font-weight:700; font-size:14px; line-height:18px; letter-spacing:var(--kc-ls); }
    .kc-food-desktop .kc-miscellaneous-serving-size__circle strong { letter-spacing:var(--kc-ls); }
    .kc-food-desktop .kc-miscellaneous-serving-size__circle .kc-copy-small { color:var(--kc-gray-1); }
    .kc-food-desktop > #kc-food-mod-1 { height:186px; }
    .kc-food-desktop > #kc-food-mod-2 { height:357px; }
    .kc-food-desktop > #kc-food-mod-3 { height:146px; }
    .kc-food-desktop > #kc-food-mod-4 { height:246px; }
    .kc-food-desktop > #kc-food-mod-5 { height:66px; }
    .kc-food-desktop .kc-food-facts { gap:16px; }
    .kc-food-desktop .kc-food-facts__row { display:flex; width:432px; gap:20px; align-items:flex-start; }
    .kc-food-desktop .kc-food-facts__row--first { height:193px; }
    .kc-food-desktop .kc-food-facts__row--second { height:108px; }
    .kc-food-desktop .kc-food-facts__col { display:flex; width:125px; flex:none; flex-direction:column; gap:16px; }
    .kc-food-desktop .kc-food-facts__col p { display:flex; width:125px; align-items:center; margin:0; color:var(--kc-gray-1); font-size:14px; line-height:18px; }
    .kc-food-desktop .kc-food-facts__col:not(.kc-food-facts__col--solo) p:first-child { height:71px; }
    .kc-food-desktop .kc-food-facts__col:not(.kc-food-facts__col--solo) p:last-child { height:62px; font-size:13px; line-height:20px; }
    .kc-food-desktop .kc-food-facts__col--solo { height:191px; }
    .kc-food-desktop .kc-food-facts__col--solo p:first-child { height:191px; font-size:14px; line-height:18px; }
    .kc-food-desktop .kc-food-facts__side { display:flex; width:266px; height:108px; flex:none; flex-direction:column; justify-content:center; padding:16px 0; }
    .kc-food-desktop .kc-food-facts__side p { display:flex; width:266px; height:76px; align-items:center; margin:0; color:var(--kc-gray-1); font-size:13px; line-height:20px; text-align:right; }
    .kc-food-desktop .kc-food-facts__img-1 { width:130px; height:193px; }
    .kc-food-desktop .kc-food-facts__img-2 { width:146px; height:104px; }
    .kc-food-desktop .kc-module-title .kc-link { display:flex; flex:none; }
    .kc-food-desktop .kc-miscellaneous-poll-trivia__question { color:var(--kc-accent); }
    .kc-food-desktop .kc-miscellaneous-poll-trivia fieldset { gap:0; margin:0; padding:0; border:0; }
    .kc-food-desktop .kc-miscellaneous-poll-trivia__options { gap:16px; }
    .kc-food-desktop .kc-miscellaneous-poll-trivia legend { padding:0; }
    .kc-food-desktop .kc-miscellaneous-poll-trivia__option:focus-visible { outline:2px solid #272320; outline-offset:2px; }
    .kc-food-desktop .kc-miscellaneous-poll-trivia__option:active { transform:scale(.98); }
    .kc-food-desktop .kc-miscellaneous-poll-trivia__letter,
    .kc-food-desktop .kc-miscellaneous-poll-trivia__choice { display:flex; height:32px; align-items:center; border:1px solid var(--kc-gray-4); background:var(--kc-white); }
    .kc-food-desktop .kc-miscellaneous-poll-trivia__letter { width:32px; flex:none; justify-content:center; border-radius:50%; }
    .kc-food-desktop .kc-miscellaneous-poll-trivia__choice { flex:1; border-radius:6px; }
    @media (prefers-reduced-motion: reduce) { .kc-food-desktop * { transition:none !important; } }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <h1 class="kc-card-board-label">Food — Desktop</h1>
      <div class="kc-full-knowledge-card kc-food-desktop-frame" data-kc="Full Knowledge Card">
        <kc-card entity="food" platform="desktop"></kc-card>


      </div>
    </div>
  </main>

</body>
</html>
