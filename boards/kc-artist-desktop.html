<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artist Knowledge Card — Desktop</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/media.js"></script>
  <script src="../assets/js/components/kc-modules/utility.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; }
    .kc-icon-defs { position:absolute; width:0; height:0; overflow:hidden; }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <h1 class="kc-card-board-label">Artist — Desktop</h1>
      <div class="kc-full-knowledge-card kc-artist-desktop-frame" data-kc="Full Knowledge Card">
        <article class="kc-card-stack kc-artist-desktop kc-theme-green" data-kc="Segment / Artist" aria-label="Janelle Monáe knowledge card">
          <kc-hero entity="artist" platform="desktop"></kc-hero>

          <kc-module entity="artist" platform="desktop" index="0"></kc-module>

          <kc-module entity="artist" platform="desktop" index="1"></kc-module>

          <kc-module entity="artist" platform="desktop" index="2"></kc-module>

          <kc-module entity="artist" platform="desktop" index="3"></kc-module>

          <kc-module entity="artist" platform="desktop" index="4"></kc-module>

          <kc-module entity="artist" platform="desktop" index="5"></kc-module>

          <kc-module entity="artist" platform="desktop" index="6"></kc-module>

          <kc-module entity="artist" platform="desktop" index="7"></kc-module>
        </article>

        <svg class="kc-icon-defs" aria-hidden="true" focusable="false">
          <symbol id="kc-artist-arrow-up" viewBox="0 0 16 16"><path d="M7.5 13.5C7.5 13.7761 7.72386 14 8 14C8.27614 14 8.5 13.7761 8.5 13.5V3.80298L12.1283 7.83448C12.3131 8.03974 12.6292 8.05638 12.8345 7.87165C13.0397 7.68692 13.0564 7.37077 12.8716 7.16552L8.37165 2.16552C8.27683 2.06016 8.14174 2 8 2C7.85826 2 7.72317 2.06016 7.62835 2.16552L3.12836 7.16552C2.94363 7.37077 2.96027 7.68692 3.16552 7.87165C3.37078 8.05638 3.68692 8.03974 3.87165 7.83448L7.5 3.80298V13.5Z" fill="currentColor"/></symbol>
          <symbol id="kc-artist-arrow-down" viewBox="0 0 16 16"><path d="M8.5 2.5C8.5 2.22386 8.27615 2 8 2C7.72386 2 7.5 2.22386 7.5 2.5V12.197L3.87165 8.16552C3.68692 7.96026 3.37077 7.94362 3.16552 8.12835C2.96027 8.31308 2.94363 8.62923 3.12836 8.83448L7.62836 13.8345C7.72318 13.9398 7.85826 14 8 14C8.14175 14 8.27683 13.9398 8.37165 13.8345L12.8717 8.83448C13.0564 8.62923 13.0397 8.31308 12.8345 8.12835C12.6292 7.94362 12.3129 7.94362 12.1283 8.16552L8.5 12.197V2.5Z" fill="currentColor"/></symbol>
        </svg>
        <form class="kc-modules-panel" aria-label="Modules">
          <h2>Modules</h2>
          <p class="kc-modules-panel__hero">Designer (hero) — always on top</p>
          <ol>
            <li><input type="checkbox" checked id="kc-artist-toggle-1" aria-controls="kc-artist-mod-1"><label for="kc-artist-toggle-1">Text List / Quick Facts</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Quick Facts up" data-move="up"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-up"></use></svg></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Quick Facts down" data-move="down"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-down"></use></svg></button></li>
            <li><input type="checkbox" checked id="kc-artist-toggle-2" aria-controls="kc-artist-mod-2"><label for="kc-artist-toggle-2">Miscellaneous / Listen</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Listen up" data-move="up"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-up"></use></svg></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Listen down" data-move="down"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-down"></use></svg></button></li>
            <li><input type="checkbox" checked id="kc-artist-toggle-3" aria-controls="kc-artist-mod-3"><label for="kc-artist-toggle-3">Miscellaneous / Quote</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Quote up" data-move="up"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-up"></use></svg></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Quote down" data-move="down"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-down"></use></svg></button></li>
            <li><input type="checkbox" checked id="kc-artist-toggle-4" aria-controls="kc-artist-mod-4"><label for="kc-artist-toggle-4">Image List / Main — Albums</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Albums up" data-move="up"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-up"></use></svg></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Albums down" data-move="down"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-down"></use></svg></button></li>
            <li><input type="checkbox" checked id="kc-artist-toggle-5" aria-controls="kc-artist-mod-5"><label for="kc-artist-toggle-5">Image List / Interesting Facts</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Interesting Facts up" data-move="up"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-up"></use></svg></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Interesting Facts down" data-move="down"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-down"></use></svg></button></li>
            <li><input type="checkbox" checked id="kc-artist-toggle-6" aria-controls="kc-artist-mod-6"><label for="kc-artist-toggle-6">Text List / Awards</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Awards up" data-move="up"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-up"></use></svg></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Awards down" data-move="down"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-down"></use></svg></button></li>
            <li><input type="checkbox" checked id="kc-artist-toggle-7" aria-controls="kc-artist-mod-7"><label for="kc-artist-toggle-7">Image List / Main — Films</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Films up" data-move="up"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-up"></use></svg></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Films down" data-move="down"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-down"></use></svg></button></li>
            <li><input type="checkbox" checked id="kc-artist-toggle-8" aria-controls="kc-artist-mod-8"><label for="kc-artist-toggle-8">Attributions</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Attributions up" data-move="up"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-up"></use></svg></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Attributions down" data-move="down"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-artist-arrow-down"></use></svg></button></li>
          </ol>
          <p class="kc-modules-panel__status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>
  <script>
    const stack = document.querySelector(".kc-artist-desktop");
    const panel = document.querySelector(".kc-modules-panel");
    const rows = Array.from(panel.querySelectorAll("li"));
    const modules = new Map(rows.map(row => {
      const checkbox = row.querySelector('input[type="checkbox"]');
      return [row, document.getElementById(checkbox.getAttribute("aria-controls"))];
    }));
    const status = panel.querySelector(".kc-modules-panel__status");
    const hero = stack.querySelector(".kc-hero-designer");

    function sync() {
      for (const [row, module] of modules) {
        module.hidden = !row.querySelector('input[type="checkbox"]').checked;
      }

      const orderedRows = Array.from(panel.querySelectorAll("li"));
      orderedRows.forEach((row, index) => {
        row.querySelector('[data-move="up"]').disabled = index === 0;
        row.querySelector('[data-move="down"]').disabled = index === orderedRows.length - 1;
      });

      const cardModules = Array.from(stack.querySelectorAll(":scope > .kc-module"));
      cardModules.forEach(module => module.classList.remove("kc-module--card-last"));
      const lastVisible = cardModules.filter(module => !module.hidden).at(-1);
      hero.classList.toggle("kc-hero-designer--card-last", !lastVisible);
      lastVisible?.classList.add("kc-module--card-last");
    }

    for (const row of rows) {
      const checkbox = row.querySelector('input[type="checkbox"]');
      const module = modules.get(row);
      checkbox.addEventListener("change", sync);

      row.querySelectorAll("[data-move]").forEach(button => {
        button.addEventListener("click", event => {
          const direction = button.dataset.move;
          const neighbor = direction === "up" ? row.previousElementSibling : row.nextElementSibling;
          if (!neighbor) return;

          if (direction === "up") {
            panel.querySelector("ol").insertBefore(row, neighbor);
            stack.insertBefore(module, module.previousElementSibling);
          } else {
            panel.querySelector("ol").insertBefore(neighbor, row);
            stack.insertBefore(modules.get(neighbor), module);
          }

          const orderedRows = Array.from(panel.querySelectorAll("li"));
          const position = orderedRows.indexOf(row) + 1;
          status.textContent = `${row.querySelector("label").textContent} moved to position ${position} of ${orderedRows.length}`;
          sync();

          const focusedButton = event.currentTarget;
          if (focusedButton.disabled) {
            row.querySelector(`[data-move="${direction === "up" ? "down" : "up"}"]:not(:disabled)`).focus();
          } else {
            focusedButton.focus();
          }
        });
      });
    }

    sync();
  </script>
</body>
</html>
