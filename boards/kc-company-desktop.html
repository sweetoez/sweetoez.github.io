<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Knowledge Card — Desktop</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/travel-map.js"></script>
  <script src="../assets/js/components/kc-modules/utility.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <script src="../assets/js/components/kc-card.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; }
    .kc-icon-defs { position:absolute; width:0; height:0; overflow:hidden; }

    .kc-company-desktop-frame { height:auto; min-height:2500px; }
    .kc-company-desktop { --kc-accent:#1B6AC7; --kc-accent-soft:#F5F9FD; position:relative; top:auto; left:auto; width:472px; margin:280px 0 0 403px; }
    .kc-company-desktop > .kc-module { margin-top:-1px; }
    .kc-company-desktop .kc-module[hidden] { display:none !important; }
    .kc-company-desktop > .kc-hero-designer--top-to-bottom.kc-hero-designer--website { height:426px; z-index:1; }
    .kc-company-desktop .kc-hero .kc-text-list-website { height:146px; }
    .kc-company-desktop .kc-hero-body { height:54px; }
    .kc-company-desktop .kc-hero-designer__social { z-index:2; visibility:visible; }
    .kc-company-desktop .kc-hero-designer__actions svg { display:block; width:16px; height:16px; flex:none; color:var(--kc-white); }
    .kc-company-desktop .kc-hero-website__globe { background-color:var(--kc-accent); }
    .kc-company-desktop .kc-hero-website a { color:var(--kc-accent); }
    .kc-company-desktop .kc-modules-panel .kc-btn-outline-icon svg { display:block; width:16px; height:16px; color:var(--kc-gray-1); }

    .kc-company-desktop > .kc-text-list-top-fact { height:100px; }
    .kc-company-desktop .kc-text-list-top-fact > .kc-divider--v { height:auto; align-self:stretch; }
    .kc-company-desktop .kc-text-list-top-fact__item { height:auto; }
    .kc-company-desktop > .kc-text-list-quick-facts { height:140px; }
    .kc-company-desktop > .kc-miscellaneous-quote { height:106px; }
    .kc-company-desktop .kc-company-top-fact__value--two-line { min-height:48px; }
    .kc-company-desktop .kc-text-list-quick-facts__list { gap:12px; }
    .kc-company-desktop .kc-text-list-quick-facts__fact:nth-child(1) dd,
    .kc-company-desktop .kc-text-list-quick-facts__fact:nth-child(4) dd { color:var(--kc-accent); }
    .kc-company-desktop .kc-miscellaneous-quote__glyph { filter:none; opacity:1; color:var(--kc-accent-soft); }

    .kc-company-desktop.kc-card-stack > .kc-module.kc-image-list-interesting-facts--2-image { height:402px; gap:16px; background:var(--kc-accent-soft); }
    .kc-company-desktop .kc-company-fact-row { align-items:flex-start; justify-content:flex-start; gap:16px; }
    .kc-company-desktop .kc-company-fact-row--first { width:435px; height:166px; justify-content:center; }
    .kc-company-desktop .kc-company-fact-row--first > p { width:138px; height:166px; }
    .kc-company-desktop .kc-company-fact-row--first > p:last-child { justify-content:flex-end; text-align:right; }
    .kc-company-desktop .kc-company-fact-row--first > .kc-img { width:127px; height:155px; }
    .kc-company-desktop .kc-company-fact-row--second { width:441px; height:188px; }
    .kc-company-desktop .kc-company-fact-row--second > .kc-img { width:125px; height:149px; }
    .kc-company-desktop .kc-company-fact-col { display:flex; width:300px; height:188px; flex:none; flex-direction:column; gap:16px; }
    .kc-company-desktop .kc-company-fact-col > p { width:282px; height:56px; }
    .kc-company-desktop .kc-company-fact-col__lower { display:flex; width:300px; height:116px; flex-direction:column; gap:16px; }
    .kc-company-desktop .kc-company-fact-col__lower > p { width:275px; height:99px; }

    .kc-company-desktop .kc-image-list-main { height:220px; background:var(--kc-white); }
    .kc-company-desktop .kc-image-list-main__tiles { height:150px; }
    .kc-company-desktop .kc-image-list-main__tile-text > span { display:block; width:80px; }
    .kc-company-desktop .kc-image-list-main__tile:nth-child(1) .kc-copy-bold,
    .kc-company-desktop .kc-image-list-main__tile:nth-child(4) .kc-copy-bold,
    .kc-company-desktop .kc-image-list-main__tile:nth-child(5) .kc-copy-bold { height:36px; }
    .kc-company-desktop .kc-image-list-main__tile:nth-child(2) .kc-copy-bold,
    .kc-company-desktop .kc-image-list-main__tile:nth-child(3) .kc-copy-bold { height:18px; }
    .kc-company-desktop .kc-image-list-main__tile:nth-child(1) .kc-copy-small { height:13px; }
    .kc-company-desktop .kc-image-list-main__tile:nth-child(n+2) .kc-copy-small { height:26px; }
    .kc-company-desktop .kc-image-list-main__tile-text { gap:0; }

    .kc-company-desktop .kc-miscellaneous-timeline { height:660px; }
    .kc-company-desktop .kc-miscellaneous-timeline__list { height:auto; margin:0; padding:0; list-style:none; }
    .kc-company-desktop .kc-miscellaneous-timeline__entry { height:auto; align-items:stretch; }
    .kc-company-desktop .kc-miscellaneous-timeline__rail { height:auto; min-height:12px; }
    .kc-company-desktop .kc-miscellaneous-timeline__rail::before { top:1px; left:5px; width:2px; height:calc(100% - 1px); background:var(--kc-accent); }
    .kc-company-desktop .kc-miscellaneous-timeline__rail::after { top:0; border-color:var(--kc-accent); }
    .kc-company-desktop .kc-miscellaneous-timeline__entry:last-child .kc-miscellaneous-timeline__rail::before { display:none; }
    .kc-company-desktop .kc-miscellaneous-timeline__content { height:auto; }
    .kc-company-desktop .kc-miscellaneous-timeline__year { color:var(--kc-accent); font-weight:700; }
    .kc-company-desktop .kc-miscellaneous-timeline__quote { font-weight:400; }

    .kc-company-desktop .kc-text-list-top-fact-text-list-attributions { height:92px; }
    .kc-company-desktop .kc-text-list-top-fact-text-list-attributions p { height:52px; }
    .kc-company-desktop .kc-module--card-last { border-radius:0 0 6px 6px; }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <h1 class="kc-card-board-label">Company — Desktop</h1>
      <div class="kc-full-knowledge-card kc-company-desktop-frame" data-kc="Full Knowledge Card">
        <kc-card entity="company" platform="desktop"></kc-card>

        <svg class="kc-icon-defs" aria-hidden="true" focusable="false">
          <symbol id="kc-company-arrow-up" viewBox="0 0 16 16"><path d="M7.5 13.5C7.5 13.7761 7.72386 14 8 14C8.27614 14 8.5 13.7761 8.5 13.5V3.80298L12.1283 7.83448C12.3131 8.03974 12.6292 8.05638 12.8345 7.87165C13.0397 7.68692 13.0564 7.37077 12.8716 7.16552L8.37165 2.16552C8.27683 2.06016 8.14174 2 8 2C7.85826 2 7.72317 2.06016 7.62835 2.16552L3.12836 7.16552C2.94363 7.37077 2.96027 7.68692 3.16552 7.87165C3.37078 8.05638 3.68692 8.03974 3.87165 7.83448L7.5 3.80298V13.5Z" fill="currentColor"/></symbol>
          <symbol id="kc-company-arrow-down" viewBox="0 0 16 16"><path d="M8.5 2.5C8.5 2.22386 8.27615 2 8 2C7.72386 2 7.5 2.22386 7.5 2.5V12.197L3.87165 8.16552C3.68692 7.96026 3.37077 7.94362 3.16552 8.12835C2.96027 8.31308 2.94363 8.62923 3.12836 8.83448L7.62836 13.8345C7.72318 13.9398 7.85826 14 8 14C8.14175 14 8.27683 13.9398 8.37165 13.8345L12.8717 8.83448C13.0564 8.62923 13.0397 8.31308 12.8345 8.12835C12.6292 7.94362 12.3129 7.94362 12.1283 8.16552L8.5 12.197V2.5Z" fill="currentColor"/></symbol>
        </svg>

      </div>
    </div>
  </main>

</body>
</html>
