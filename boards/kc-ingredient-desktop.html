<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingredient Knowledge Card — Desktop</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/travel-map.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <script src="../assets/js/components/kc-card.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; font-weight:400; }

    .kc-ingredient-desktop-frame { height:auto; min-height:1500px; }
    .kc-ingredient-desktop > .kc-hero-designer--top-to-bottom { height:382px; }
    .kc-ingredient-desktop .kc-hero .kc-text-list { height:102px; padding:32px 20px 16px; }
    .kc-ingredient-desktop .kc-hero-body { height:54px; font-weight:600; }
    .kc-ingredient-desktop > .kc-hero-designer--card-last .kc-text-list { border-radius:0 0 6px 6px; }
    .kc-ingredient-desktop .kc-module--card-last { border-radius:0 0 6px 6px; }
    .kc-ingredient-desktop [hidden] { display:none !important; }

    .kc-ingredient-desktop .kc-miscellaneous-serving-size,
    .kc-ingredient-desktop .kc-ingredient-facts { padding-block:15px; }
    .kc-ingredient-desktop .kc-miscellaneous-serving-size__circle { background:var(--kc-accent-soft); }

    .kc-ingredient-desktop .kc-ingredient-facts { height:392px; gap:16px; background:var(--kc-accent-soft); }
    .kc-ingredient-desktop .kc-ingredient-facts__row { display:flex; gap:20px; }
    .kc-ingredient-desktop .kc-ingredient-facts__row--first { width:432px; height:225px; align-items:flex-start; }
    .kc-ingredient-desktop .kc-ingredient-facts__row--second { width:405px; height:119px; align-items:center; }
    .kc-ingredient-desktop .kc-ingredient-facts__col { display:flex; flex-direction:column; gap:16px; flex:none; }
    .kc-ingredient-desktop .kc-ingredient-facts__row--first .kc-ingredient-facts__col { width:282px; height:225px; }
    .kc-ingredient-desktop .kc-ingredient-facts__row--second .kc-ingredient-facts__col { width:266px; height:93px; }
    .kc-ingredient-desktop .kc-ingredient-facts__col p { display:flex; align-items:center; margin:0; color:var(--kc-gray-2); font-size:14px; line-height:18px; }
    .kc-ingredient-desktop .kc-ingredient-facts__row--first .kc-ingredient-facts__col p:first-child { height:94px; }
    .kc-ingredient-desktop .kc-ingredient-facts__row--first .kc-ingredient-facts__col p:last-child { height:98px; }
    .kc-ingredient-desktop .kc-ingredient-facts__row--second .kc-ingredient-facts__col p { height:76px; justify-content:flex-end; text-align:right; }
    .kc-ingredient-desktop .kc-ingredient-facts .kc-divider { display:block; width:100%; height:1px; flex:none; background:var(--kc-border, #DDD); }
    .kc-ingredient-desktop .kc-ingredient-facts__row--first .kc-img { width:130px; height:193px; flex:none; }
    .kc-ingredient-desktop .kc-ingredient-facts__row--second .kc-img { width:119px; height:119px; flex:none; }

    .kc-ingredient-desktop .kc-image-list-ingredients { height:106px; gap:16px; align-items:flex-start; justify-content:flex-start; }
    .kc-ingredient-desktop .kc-image-list-ingredients__list { gap:0; }
    .kc-ingredient-desktop .kc-image-list-ingredients__row { height:36px; }
    .kc-ingredient-desktop .kc-image-list-ingredients__item { height:36px; flex:none; }
    .kc-ingredient-desktop .kc-image-list-ingredients__item:nth-child(1) { width:139px; }
    .kc-ingredient-desktop .kc-image-list-ingredients__item:nth-child(2) { width:138px; }
    .kc-ingredient-desktop .kc-image-list-ingredients__item:nth-child(3) { width:139px; }

    .kc-ingredient-desktop .kc-text-list-top-fact-text-list-attributions { height:66px; }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <h1 class="kc-card-board-label">Ingredient — Desktop</h1>
      <div class="kc-full-knowledge-card kc-ingredient-desktop-frame" data-kc="Full Knowledge Card">
        <kc-card entity="ingredient" platform="desktop"></kc-card>


      </div>
    </div>
  </main>

</body>
</html>
