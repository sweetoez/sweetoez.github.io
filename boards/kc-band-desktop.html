<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Band Knowledge Card — Desktop</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/media.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <script src="../assets/js/components/kc-card.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; }
    .kc-icon-defs { position:absolute; width:0; height:0; overflow:hidden; }

    .kc-band-desktop > .kc-hero-designer--top-to-bottom.kc-hero-designer--website { height:auto; z-index:1; }
    .kc-band-desktop .kc-hero .kc-text-list-website { height:146px; gap:12px; }
    .kc-band-desktop .kc-hero-body { height:54px; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; line-clamp:3; }
    .kc-band-desktop .kc-hero-designer__social { z-index:2; visibility:visible; }
    .kc-band-desktop .kc-hero-designer__actions svg { display:block; width:16px; height:16px; flex:none; color:var(--kc-white); }
    .kc-band-desktop .kc-hero-designer__title__name { font-size:50px; line-height:50px; }
    .kc-band-desktop .kc-hero-website__globe { background-color:var(--kc-accent); }
    .kc-band-desktop .kc-hero-website a { color:var(--kc-accent-foreground, var(--kc-accent)); }

    .kc-band-desktop .kc-image-list-main { height:207px; background:var(--kc-accent-soft); }
    .kc-band-desktop .kc-image-list-main__tiles { height:137px; }
    .kc-band-desktop .kc-image-list-main__tile-text { gap:0; }
    .kc-band-desktop .kc-image-list-main__tile-text > span { display:block; overflow:hidden; white-space:normal; text-overflow:clip; }
    .kc-band-desktop .kc-band-desktop__tile-title { height:36px; }
    .kc-band-desktop .kc-band-desktop__tile-title--single { height:18px; }
    .kc-band-desktop .kc-band-desktop__tile-sub { height:13px; }

    .kc-band-desktop .kc-miscellaneous-listen { height:102px; }
    .kc-band-desktop .kc-miscellaneous-listen__row { width:432px; flex-wrap:nowrap; overflow:visible; gap:19px; }
    .kc-band-desktop .kc-miscellaneous-listen__service { flex:none; }
    .kc-band-desktop .kc-miscellaneous-listen__service img { width:32px; height:32px; flex:none; object-fit:contain; }
    .kc-band-desktop .kc-miscellaneous-listen__service span { font-weight:600; }

    .kc-band-desktop .kc-band-desktop__facts { height:337px; gap:16px; padding:16px 10px 16px 20px; align-items:flex-start; flex-direction:column; background:var(--kc-accent-soft); }
    .kc-band-desktop .kc-band-desktop__facts-row { display:flex; flex:none; align-items:flex-start; gap:20px; }
    .kc-band-desktop .kc-band-desktop__facts-row--first { width:431px; height:116px; }
    .kc-band-desktop .kc-band-desktop__facts-row--second { width:438px; height:97px; }
    .kc-band-desktop .kc-band-desktop__facts-row > .kc-img { border-radius:6px; }
    .kc-band-desktop .kc-band-desktop__facts-row--first > .kc-img { width:174px; height:116px; }
    .kc-band-desktop .kc-band-desktop__facts-row--second > .kc-img { width:149.5px; height:82.05px; }
    .kc-band-desktop .kc-band-desktop__facts-col { display:flex; flex:none; flex-direction:column; align-items:flex-start; }
    .kc-band-desktop .kc-band-desktop__facts-col--first { width:237px; height:113px; gap:24px; padding:12px 17px 0 0; }
    .kc-band-desktop .kc-band-desktop__facts-col--second { width:269px; height:82px; gap:16px; }
    .kc-band-desktop .kc-band-desktop__facts-col .kc-copy { display:flex; align-items:center; justify-content:flex-end; text-align:right; margin:0; }
    .kc-band-desktop .kc-band-desktop__facts-col--first .kc-copy { width:228px; height:76px; }
    .kc-band-desktop .kc-band-desktop__facts-col--first .kc-divider { width:237px; margin-right:-17px; }
    .kc-band-desktop .kc-band-desktop__facts-col--second .kc-divider { width:265px; }
    .kc-band-desktop .kc-band-desktop__facts-col--second .kc-copy { width:262px; height:53px; }
    .kc-band-desktop .kc-band-desktop__facts-highlight { display:flex; width:432px; height:58px; flex:none; align-items:center; margin:0; color:var(--kc-accent-foreground, var(--kc-accent)); font-size:18px; font-weight:600; line-height:22px; }

    .kc-band-desktop .kc-text-list-awards { height:226px; }
    .kc-band-desktop .kc-text-list-top-fact-text-list-attributions { height:66px; }
    .kc-band-desktop .kc-module--card-last { border-radius:0 0 6px 6px; }
    .kc-band-desktop .kc-modules-panel .kc-btn-outline-icon svg { display:block; width:16px; height:16px; color:var(--kc-gray-1); }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>

      </div>
    </div>
  </main>

</html>
