<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planet Knowledge Card — Desktop</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main,.kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; }
    body .kc-full-knowledge-card :focus-visible { outline:2px solid #272320; outline-offset:2px; }
    body button:active:not(:disabled) { transform:scale(.98); }
    body button:disabled { opacity:.4; cursor:not-allowed; }
    .kc-planet-desktop > .kc-hero-designer--top-to-bottom { height:346px; z-index:1; padding-top:0; }
    .kc-planet-desktop .kc-hero-header { margin:0 0 -16px; }
    .kc-planet-desktop .kc-hero .kc-text-list { height:66px; padding:32px 20px 16px; }
    .kc-planet-desktop > .kc-hero-designer--card-last .kc-text-list { border-radius:0 0 6px 6px; }
    .kc-planet-desktop .kc-hero-designer__image { background:transparent; }
    .kc-planet-desktop .kc-hero-designer--top-to-bottom .kc-hero-designer__title__name { display:flex; flex:none; align-items:flex-end; height:100px; margin:0; padding-bottom:6px; color:var(--kc-white); font-size:50px; line-height:50px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .kc-planet-desktop .kc-hero-designer__social { z-index:2; visibility:visible; }
    .kc-planet-desktop .kc-hero-designer__actions svg { display:block; width:16px; height:16px; flex:none; color:var(--kc-white); }
    .kc-planet-desktop .kc-module.kc-text-list-top-fact { height:100px; padding:0 20px; }
    .kc-planet-desktop .kc-module.kc-image-list-interesting-facts { height:383px; background:var(--kc-accent-soft); }
    .kc-planet-desktop .kc-module.kc-image-list-interesting-facts .kc-image-list-interesting-facts__row:first-child { height:216px; align-items:flex-start; }
    .kc-planet-desktop .kc-module.kc-image-list-interesting-facts .kc-image-list-interesting-facts__row:last-child { height:119px; align-items:flex-start; }
    .kc-planet-desktop .kc-module.kc-image-list-interesting-facts .kc-planet-fact-row--first .kc-image-list-interesting-facts__text { width:216px; height:216px; gap:16px; }
    .kc-planet-desktop .kc-module.kc-image-list-interesting-facts .kc-planet-fact-row--first .kc-image-list-interesting-facts__text p { display:flex; width:216px; }
    .kc-planet-desktop .kc-module.kc-image-list-interesting-facts .kc-planet-fact-row--first .kc-image-list-interesting-facts__text p:first-child { height:98px; }
    .kc-planet-desktop .kc-module.kc-image-list-interesting-facts .kc-planet-fact-row--first .kc-image-list-interesting-facts__text p:last-child { height:85px; }
    .kc-planet-desktop .kc-planet-fact-row--first .kc-img { width:196px; height:200px; }
    .kc-planet-desktop .kc-module.kc-image-list-interesting-facts .kc-planet-fact-row--second .kc-image-list-interesting-facts__text { width:266px; height:93px; gap:16px; }
    .kc-planet-desktop .kc-module.kc-image-list-interesting-facts .kc-planet-fact-row--second .kc-image-list-interesting-facts__text p { display:flex; width:266px; height:76px; text-align:right; }
    .kc-planet-desktop .kc-planet-fact-row--second .kc-img { width:119px; height:119px; }
    .kc-planet-desktop .kc-module.kc-miscellaneous-timeline { height:371px; }
    .kc-planet-desktop .kc-miscellaneous-timeline__list { height:301px; margin:0; padding:0; list-style:none; }
    .kc-planet-desktop .kc-miscellaneous-timeline__entry { min-height:0; }
    .kc-planet-desktop .kc-miscellaneous-timeline__entry:nth-child(1) { height:92px; }
    .kc-planet-desktop .kc-miscellaneous-timeline__entry:nth-child(2) { height:74px; }
    .kc-planet-desktop .kc-miscellaneous-timeline__entry:nth-child(3) { height:61px; }
    .kc-planet-desktop .kc-miscellaneous-timeline__entry:nth-child(4) { height:74px; }
    .kc-planet-desktop .kc-miscellaneous-timeline__rail { height:100%; }
    .kc-planet-desktop .kc-miscellaneous-timeline__rail::before { height:calc(100% - 1px); }
    .kc-planet-desktop .kc-miscellaneous-timeline__entry:last-child .kc-miscellaneous-timeline__rail::before { display:none; }
    .kc-planet-desktop .kc-miscellaneous-timeline__content { height:auto; min-height:0; }
    .kc-planet-desktop .kc-miscellaneous-timeline__year { color:var(--kc-accent); }
    .kc-planet-desktop .kc-module.kc-text-list-top-fact-text-list-attributions { height:66px; padding:20px; }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <p class="kc-card-board-label">Planet — Desktop</p>
      <div class="kc-full-knowledge-card" data-kc="Full Knowledge Card">
        <article class="kc-card-stack kc-planet-desktop kc-theme-orange" data-kc="Segment / Celestial Body" aria-label="Jupiter knowledge card">
          <kc-hero entity="planet" platform="desktop"></kc-hero>

          <kc-module entity="planet" platform="desktop" index="0"></kc-module>

          <kc-module entity="planet" platform="desktop" index="1"></kc-module>

          <kc-module entity="planet" platform="desktop" index="2"></kc-module>

          <section class="kc-module kc-miscellaneous-timeline" id="kc-planet-desktop-mod-timeline" data-kc="Miscellaneous / Timeline" aria-label="Jupiter timeline">
            <div class="kc-module-title kc-module-title--no-chevron"><h3>Timeline</h3></div>
            <ol class="kc-miscellaneous-timeline__list">
              <li class="kc-miscellaneous-timeline__entry"><span class="kc-miscellaneous-timeline__rail" aria-hidden="true"></span><div class="kc-miscellaneous-timeline__content"><strong class="kc-miscellaneous-timeline__year">1610</strong><p class="kc-miscellaneous-timeline__quote">Galileo spots Jupiter's four largest moons.</p></div></li>
              <li class="kc-miscellaneous-timeline__entry"><span class="kc-miscellaneous-timeline__rail" aria-hidden="true"></span><div class="kc-miscellaneous-timeline__content"><strong class="kc-miscellaneous-timeline__year">1979</strong><p class="kc-miscellaneous-timeline__quote">Voyager 1 and 2 fly by Jupiter.</p></div></li>
              <li class="kc-miscellaneous-timeline__entry"><span class="kc-miscellaneous-timeline__rail" aria-hidden="true"></span><div class="kc-miscellaneous-timeline__content"><strong class="kc-miscellaneous-timeline__year">1995</strong><p class="kc-miscellaneous-timeline__quote">Galileo probe enters Jupiter's atmosphere.</p></div></li>
              <li class="kc-miscellaneous-timeline__entry"><span class="kc-miscellaneous-timeline__rail" aria-hidden="true"></span><div class="kc-miscellaneous-timeline__content"><strong class="kc-miscellaneous-timeline__year">2016</strong><p class="kc-miscellaneous-timeline__quote">Juno arrives at Jupiter.</p></div></li>
            </ol>
          </section>

          <kc-module entity="planet" platform="desktop" index="4"></kc-module>
        </article>

        <form class="kc-modules-panel" aria-label="Modules">
          <h2>Modules</h2><p class="kc-modules-panel__hero">Designer (hero) — always on top</p>
          <ol>
            <li><input type="checkbox" checked id="planet-fact-one-toggle" aria-controls="kc-planet-desktop-mod-fact-one"><label for="planet-fact-one-toggle">Text List / Top Fact</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move top fact up" data-move="up"><img src="../assets/icons/ic_fluent_arrow_up_16_regular.svg" alt="" aria-hidden="true"></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move top fact down" data-move="down"><img src="../assets/icons/ic_fluent_arrow_down_16_regular.svg" alt="" aria-hidden="true"></button></li>
            <li><input type="checkbox" checked id="planet-interesting-toggle" aria-controls="kc-planet-desktop-mod-interesting"><label for="planet-interesting-toggle">Image List / Interesting Facts</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move interesting facts up" data-move="up"><img src="../assets/icons/ic_fluent_arrow_up_16_regular.svg" alt="" aria-hidden="true"></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move interesting facts down" data-move="down"><img src="../assets/icons/ic_fluent_arrow_down_16_regular.svg" alt="" aria-hidden="true"></button></li>
            <li><input type="checkbox" checked id="planet-fact-two-toggle" aria-controls="kc-planet-desktop-mod-fact-two"><label for="planet-fact-two-toggle">Text List / Top Fact</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move top facts up" data-move="up"><img src="../assets/icons/ic_fluent_arrow_up_16_regular.svg" alt="" aria-hidden="true"></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move top facts down" data-move="down"><img src="../assets/icons/ic_fluent_arrow_down_16_regular.svg" alt="" aria-hidden="true"></button></li>
            <li><input type="checkbox" checked id="planet-timeline-toggle" aria-controls="kc-planet-desktop-mod-timeline"><label for="planet-timeline-toggle">Miscellaneous / Timeline</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move timeline up" data-move="up"><img src="../assets/icons/ic_fluent_arrow_up_16_regular.svg" alt="" aria-hidden="true"></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move timeline down" data-move="down"><img src="../assets/icons/ic_fluent_arrow_down_16_regular.svg" alt="" aria-hidden="true"></button></li>
            <li><input type="checkbox" checked id="planet-attributions-toggle" aria-controls="kc-planet-desktop-mod-attributions"><label for="planet-attributions-toggle">Attributions</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move attributions up" data-move="up"><img src="../assets/icons/ic_fluent_arrow_up_16_regular.svg" alt="" aria-hidden="true"></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move attributions down" data-move="down"><img src="../assets/icons/ic_fluent_arrow_down_16_regular.svg" alt="" aria-hidden="true"></button></li>
          </ol>
          <p class="kc-modules-panel__status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>
  <script>
    const stack = document.querySelector(".kc-planet-desktop");
    const panel = document.querySelector(".kc-modules-panel");
    const rows = Array.from(panel.querySelectorAll("li"));
    const modules = new Map(rows.map(row => {
      const checkbox = row.querySelector('input[type="checkbox"]');
      return [row, document.getElementById(checkbox.getAttribute("aria-controls"))];
    }));
    const status = panel.querySelector(".kc-modules-panel__status");
    const hero = stack.querySelector(".kc-hero-designer");

    function sync() {
      for (const [row, module] of modules) {
        module.hidden = !row.querySelector('input[type="checkbox"]').checked;
      }

      const orderedRows = Array.from(panel.querySelectorAll("li"));
      orderedRows.forEach((row, index) => {
        row.querySelector('[data-move="up"]').disabled = index === 0;
        row.querySelector('[data-move="down"]').disabled = index === orderedRows.length - 1;
      });

      const cardModules = Array.from(stack.querySelectorAll(":scope > .kc-module"));
      cardModules.forEach(module => module.classList.remove("kc-module--card-last"));
      const lastVisible = cardModules.filter(module => !module.hidden).at(-1);
      hero.classList.toggle("kc-hero-designer--card-last", !lastVisible);
      lastVisible?.classList.add("kc-module--card-last");
    }

    for (const row of rows) {
      const checkbox = row.querySelector('input[type="checkbox"]');
      const module = modules.get(row);
      checkbox.addEventListener("change", sync);

      row.querySelectorAll("[data-move]").forEach(button => {
        button.addEventListener("click", event => {
          const direction = button.dataset.move;
          const neighbor = direction === "up" ? row.previousElementSibling : row.nextElementSibling;
          if (!neighbor) return;

          if (direction === "up") {
            panel.querySelector("ol").insertBefore(row, neighbor);
            stack.insertBefore(module, module.previousElementSibling);
          } else {
            panel.querySelector("ol").insertBefore(neighbor, row);
            stack.insertBefore(modules.get(neighbor), module);
          }

          const orderedRows = Array.from(panel.querySelectorAll("li"));
          const position = orderedRows.indexOf(row) + 1;
          status.textContent = `${row.querySelector("label").textContent} moved to position ${position} of ${orderedRows.length}`;
          sync();

          const focusedButton = event.currentTarget;
          if (focusedButton.disabled) {
            row.querySelector(`[data-move="${direction === "up" ? "down" : "up"}"]:not(:disabled)`).focus();
          } else {
            focusedButton.focus();
          }
        });
      });
    }

    sync();
  </script>
</body>
</html>
