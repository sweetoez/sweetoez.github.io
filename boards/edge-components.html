<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edge components</title>
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="../assets/css/edge-chrome.css">
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/include.js"></script>
  <script defer src="../assets/js/fluent-motion.js"></script>
  <script defer src="../assets/js/edge-components.js"></script>
  <style>
    body {
      min-width: 663px;
      margin: 0;
      /* STAND-IN: neutral board canvas. */
      background: #F5F5F5;
      color: #1B1B1B;
      font-family: var(--font-body);
    }

    .edge-components-board {
      min-height: 100vh;
      padding: 20px;
      color: var(--edge-text);
    }

    .edge-components-controls {
      display: flex;
      min-height: 40px;
      align-items: center;
      gap: 16px;
      margin: 0 auto 20px;
    }

    .edge-components-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .edge-components-controls input {
      width: 260px;
      accent-color: #272320;
    }

    .edge-components-controls output {
      min-width: 76px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .edge-components-controls button {
      min-height: 32px;
      padding: 4px 12px;
      border: 1px solid #BDBDB8;
      border-radius: 4px;
      background: #FFFFFF;
      color: #272320;
      font: inherit;
      cursor: pointer;
    }

    .edge-components-controls button[aria-pressed="true"] {
      border-color: #272320;
      background: #272320;
      color: #FFFFFF;
    }

    .edge-components-controls button:focus-visible,
    .edge-components-controls input:focus-visible {
      outline: 2px solid #0F6CBD;
      outline-offset: 2px;
    }

    .edge-components-viewport {
      width: 100%;
      overflow: auto;
      padding-bottom: 12px;
    }

    .edge-components-window {
      --edge-demo-width: 1447px;
      position: relative;
      width: var(--edge-demo-width);
      height: 900px;
      overflow: hidden;
      border-radius: 8px;
      background: var(--edge-page-surface);
      container-name: edge-components-window;
      container-type: inline-size;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .18);
    }

    .edge-components-window .edge-window {
      position: relative;
      top: auto;
      left: auto;
      width: 100%;
      height: 100%;
      border-radius: 0;
      transform: none;
    }

    .edge-components-page {
      display: flex;
      min-height: 748px;
      flex: 1;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
      background: var(--edge-page-surface);
    }

    .edge-components-page .ntp-topnav {
      flex: none;
    }

    .edge-components-page .ntp-hero {
      width: 100%;
    }

    .edge-components-page .edge-shortcut-add .edge-icon {
      width: 24px;
      height: 24px;
    }

    html[data-theme="dark"] body {
      background: #1B1B1B;
    }

    html[data-theme="dark"] .edge-components-controls {
      color: #FFFFFF;
    }

  </style>
</head>
<body class="demo">
  <main class="edge-components-board">
    <nav class="edge-components-controls" aria-label="Demo controls">
      <div role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" aria-pressed="true">Light</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
      <label for="edge-component-width">
        Window width
        <input id="edge-component-width" type="range" min="663" max="1978" value="1447">
        <output for="edge-component-width">1447 px</output>
      </label>
    </nav>
    <div class="edge-components-viewport">
      <section class="edge-components-window" aria-label="Edge components preview window">
        <div class="edge-window">
          <div data-include="edge-tab-band"></div>
          <div data-include="edge-toolbar"></div>
          <div data-include="edge-favorites-bar"></div>
          <div class="edge-components-page">
            <div data-include="msn-nav"></div>
            <section class="ntp-hero" aria-label="Search and shortcuts">
              <div data-include="composer"></div>
              <div data-include="shortcuts"></div>
            </section>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
