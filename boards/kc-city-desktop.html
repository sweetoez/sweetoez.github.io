<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Knowledge Card — Desktop</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/travel-map.js"></script>
  <script src="../assets/js/components/kc-modules/utility.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <script src="../assets/js/components/kc-card.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; }
    .kc-city-desktop-frame { height:auto; min-height:1849px; }
    .kc-city-desktop { --kc-accent:#1358A9; --kc-accent-soft:#F5F9FD; position:relative; top:auto; left:auto; width:472px; margin:280px 0 0 403px; }
    .kc-city-desktop .kc-module[hidden] { display:none !important; }
    .kc-city-desktop > .kc-module { padding:15px 19px; }
    .kc-city-desktop > .kc-text-list-top-fact { height:100px; padding:0 20px; }
    .kc-city-desktop > .kc-miscellaneous-map { height:160px; }
    .kc-city-desktop > .kc-miscellaneous-travel { height:64px; }
    .kc-city-desktop > .kc-miscellaneous-visit-times { height:172px; }
    .kc-city-desktop > .kc-image-list-places-to-visit { height:212px; }
    .kc-city-desktop > .kc-image-list-interesting-facts { height:310px; padding:15px 9px 15px 19px; }
    .kc-city-desktop > .kc-miscellaneous-poll-trivia { height:198px; }
    .kc-city-desktop > .kc-text-list-top-fact-text-list-attributions { height:66px; padding:19px; }
    .kc-city-desktop .kc-miscellaneous-travel__action { gap:4px; white-space:nowrap; }
    .kc-city-desktop .kc-miscellaneous-poll-trivia fieldset { min-width:0; margin:0; padding:0; border:0; }
    .kc-city-desktop .kc-module--card-last { border-radius:0 0 6px 6px; }
    .kc-city-desktop > .kc-hero-designer--card-last .kc-text-list-website { border-radius:0 0 6px 6px; }
    .kc-city-desktop .kc-hero-designer__actions svg { display:block; width:16px; height:16px; flex:none; color:var(--kc-white); }
    .kc-city-desktop .kc-hero-website__globe { background-color:var(--kc-accent); }
    .kc-city-desktop .kc-hero-website a { color:var(--kc-accent); }
    .kc-city-desktop .kc-text-list-top-fact--quantity-3 { gap:8px; }
    .kc-city-desktop .kc-text-list-top-fact--quantity-3 .kc-text-list-top-fact__item { width:140px; height:68px; flex:none; align-items:center; justify-content:center; }
    .kc-city-desktop .kc-text-list-top-fact--quantity-3 > .kc-divider--v { height:100px; }
    .kc-city-desktop .kc-miscellaneous-map__frame { overflow:hidden; }
    .kc-city-desktop .kc-miscellaneous-visit-times__bar { background:linear-gradient(180deg,#009BDE 0%,var(--kc-accent) 100%); }
    .kc-city-desktop .kc-miscellaneous-poll-trivia__question { color:#1B6AC7; }
    .kc-city-desktop .kc-miscellaneous-poll-trivia__options { gap:16px; }
    .kc-city-desktop .kc-miscellaneous-poll-trivia legend { padding:0; }
    .kc-city-desktop .kc-image-list-places-to-visit { background:var(--kc-accent-soft); }
    .kc-city-desktop .kc-btn-outline:focus-visible,
    .kc-city-desktop .kc-btn-on-image:focus-visible,
    .kc-city-desktop .kc-miscellaneous-poll-trivia__option:focus-visible { outline:2px solid #272320; outline-offset:2px; }
    .kc-city-desktop .kc-btn-on-image:active,
    .kc-city-desktop .kc-btn-outline:active { transform:scale(.98); }
    .kc-city-desktop .kc-image-list-interesting-facts--2-image { gap:16px; }
    .kc-city-desktop .kc-image-list-interesting-facts__text p.kc-copy { margin:0; }
    .kc-city-desktop .kc-city-fact-row--first { height:159px; }
    .kc-city-desktop .kc-city-fact-row--first .kc-image-list-interesting-facts__text { width:282px; height:152px; flex:none; }
    .kc-city-desktop .kc-city-fact-row--first .kc-image-list-interesting-facts__text p { display:block; width:282px; line-height:20px; }
    .kc-city-desktop .kc-city-fact-row--first .kc-image-list-interesting-facts__text p:first-child { height:43px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
    .kc-city-desktop .kc-city-fact-row--first .kc-image-list-interesting-facts__text p:last-child { height:76px; line-height:18px; overflow:hidden; }
    .kc-city-desktop .kc-city-fact-row--first .kc-divider, .kc-city-desktop .kc-city-fact-row--second .kc-divider { width:100%; }
    .kc-city-desktop .kc-city-fact-row--first > .kc-img { width:130px; height:159px; flex:none; }
    .kc-city-desktop .kc-city-fact-row--second { width:438px; height:103px; }
    .kc-city-desktop .kc-city-fact-row--second > .kc-img { width:104px; height:103px; flex:none; }
    .kc-city-desktop .kc-city-fact-row--second .kc-image-list-interesting-facts__text { width:314px; height:93px; flex:none; }
    .kc-city-desktop .kc-city-fact-row--second .kc-image-list-interesting-facts__text p { display:block; width:314px; height:auto; text-align:right; line-height:18px; }
    .kc-city-desktop .kc-text-list-top-fact-text-list-attributions a { color:inherit; text-decoration:underline; }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <h1 class="kc-card-board-label">City — Desktop</h1>
      <div class="kc-full-knowledge-card kc-city-desktop-frame" data-kc="Full Knowledge Card">
        <kc-card entity="city" platform="desktop"></kc-card>


      </div>
    </div>
  </main>

</body>
</html>
