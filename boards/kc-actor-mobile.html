                    <ol>

            <li><input type="checkbox" checked id="kc-actor-mobile-toggle-main" aria-controls="kc-actor-mobile-mod-main"><label for="kc-actor-mobile-toggle-main">Mobile / Image List / Main</label><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Featured Songs up" data-move="up"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-actor-mobile-arrow-up"></use></svg></button><button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Featured Songs down" data-move="down"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#kc-actor-mobile-arrow-down"></use></svg></button></li>

          <p class="kc-modules-panel__status" aria-live="polite"></p>

  </main>
  <script>
    const stack = document.querySelector(".kc-actor-mobile");
    const panel = document.querySelector(".kc-modules-panel");
    const rows = Array.from(panel.querySelectorAll("li"));
    const modules = new Map(rows.map(row => {
      const checkbox = row.querySelector('input[type="checkbox"]');
      return [row, document.getElementById(checkbox.getAttribute("aria-controls"))];
    }));
    const status = panel.querySelector(".kc-modules-panel__status");
    const expansion = stack.querySelector(".kc-mobile-expansion-see-more");
    const more = document.getElementById("kc-actor-mobile-more");
    const expansionLabel = expansion.querySelector(".kc-mobile-expansion-see-more__label");
    const hero = stack.querySelector(".kc-mobile-designer");
    const carousel = stack.querySelector(".kc-mobile-image-list-carousel .kc-scroll-row");
    const previousCarousel = stack.querySelector(".kc-actor-mobile-carousel__previous");
    const nextCarousel = stack.querySelector(".kc-actor-mobile-carousel__next");
    let expanded = false;

    function syncCarousel() {
      previousCarousel.disabled = carousel.scrollLeft <= 0;
      nextCarousel.disabled = carousel.scrollLeft + carousel.clientWidth >= carousel.scrollWidth - 1;
    }

    function scrollCarousel(direction) {
      const behavior = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth";
      carousel.scrollBy({ left:direction * 140, behavior });
      syncCarousel();
    }

    function sync() {
      const orderedRows = Array.from(panel.querySelectorAll("li"));
      const orderedModules = orderedRows.map(row => modules.get(row));
      const checkedModules = orderedRows
        .filter(row => row.querySelector('input[type="checkbox"]').checked)
        .map(row => modules.get(row));
      const mainModules = checkedModules.slice(0, 6);
      const moreModules = checkedModules.slice(6);

      for (const [row, module] of modules) {
        module.hidden = !row.querySelector('input[type="checkbox"]').checked;
        module.classList.remove("kc-module--card-last");
      }

      for (const module of orderedModules.filter(item => !checkedModules.includes(item) || mainModules.includes(item))) {
        stack.insertBefore(module, more);
      }
      for (const module of moreModules) more.append(module);

      if (!moreModules.length) expanded = false;
      more.hidden = !expanded || !moreModules.length;
      expansion.hidden = !moreModules.length;
      expansion.setAttribute("aria-expanded", String(expanded));
      expansionLabel.textContent = expanded ? "See less" : "See more";

      const visibleModules = expanded ? checkedModules : mainModules;
      const lastVisible = visibleModules.at(-1);
      if (!moreModules.length) lastVisible?.classList.add("kc-module--card-last");
      hero.classList.toggle("kc-mobile-designer--card-last", !lastVisible && !moreModules.length);

      orderedRows.forEach((row, index) => {
        row.querySelector('[data-move="up"]').disabled = index === 0;
        row.querySelector('[data-move="down"]').disabled = index === orderedRows.length - 1;
      });
    }

    for (const row of rows) {
      const checkbox = row.querySelector('input[type="checkbox"]');
      checkbox.addEventListener("change", sync);

      row.querySelectorAll("[data-move]").forEach(button => {
        button.addEventListener("click", event => {
          const direction = button.dataset.move;
          const neighbor = direction === "up" ? row.previousElementSibling : row.nextElementSibling;
          if (!neighbor) return;

          if (direction === "up") {
            panel.querySelector("ol").insertBefore(row, neighbor);
          } else {
            panel.querySelector("ol").insertBefore(neighbor, row);
          }

          const position = Array.from(panel.querySelectorAll("li")).indexOf(row) + 1;
          status.textContent = `${row.querySelector("label").textContent} moved to position ${position} of ${rows.length}`;
          sync();

          const focusedButton = event.currentTarget;
          if (focusedButton.disabled) {
            row.querySelector(`[data-move="${direction === "up" ? "down" : "up"}"]:not(:disabled)`).focus();
          } else {
            focusedButton.focus();
          }
        });
      });
    }

    expansion.addEventListener("click", () => {
      expanded = !expanded;
      sync();
    });

    carousel.addEventListener("scroll", syncCarousel, { passive:true });
    carousel.addEventListener("keydown", event => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      scrollCarousel(event.key === "ArrowLeft" ? -1 : 1);
    });
    previousCarousel.addEventListener("click", () => scrollCarousel(-1));
    nextCarousel.addEventListener("click", () => scrollCarousel(1));

    stack.querySelectorAll(".kc-mobile-hero-tabs-container").forEach(tablist => {
      tablist.addEventListener("click", event => {
        const tab = event.target.closest(".kc-mobile-hero-tab");
        if (!tab || !tablist.contains(tab)) return;
        tablist.querySelectorAll(".kc-mobile-hero-tab").forEach(item => {
          const selected = item === tab;
          item.classList.toggle("kc-mobile-hero-tab--selected", selected);
          item.setAttribute("aria-selected", String(selected));
        });
      });
    });

    sync();
    syncCarousel();
  </script>
</body>
</html>
