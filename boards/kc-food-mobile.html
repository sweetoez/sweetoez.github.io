<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Knowledge Card — Mobile</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/travel-map.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; }

    .kc-food-mobile-frame { height:auto; min-height:1500px; padding-bottom:109px; }
    .kc-food-mobile { position:relative; top:auto; left:auto; width:360px; margin:280px 0 0 403px; }
    .kc-food-mobile .kc-mobile-designer { height:362px; }
    .kc-food-mobile .kc-mobile-designer__top-actions svg { display:block; width:12px; height:12px; flex:none; color:var(--kc-white); }
    .kc-food-mobile .kc-mobile-designer__entity { white-space:normal; }
    .kc-food-mobile .kc-mobile-hero-text-list { height:150px; }
    .kc-food-mobile .kc-mobile-hero-tabs { border-radius:100px 0 0 100px; }
    .kc-food-mobile .kc-mobile-hero-tabs-container { width:max-content; }
    .kc-food-mobile .kc-mobile-hero-tab { background:var(--kc-accent-soft); color:var(--kc-accent); }
    .kc-food-mobile .kc-mobile-hero-tab--selected { background:var(--kc-accent); color:var(--kc-white); }
    .kc-food-mobile .kc-mobile-hero-tab:not(.kc-mobile-hero-tab--selected):hover { background:var(--kc-accent-soft); filter:brightness(.96); }
    .kc-food-mobile .kc-mobile-hero-tab:not(.kc-mobile-hero-tab--selected):active { background:var(--kc-accent-soft); filter:brightness(.92); }
    .kc-food-mobile .kc-mobile-hero-tab--selected:hover { background:var(--kc-accent); filter:brightness(.96); }
    .kc-food-mobile .kc-mobile-hero-tab--selected:active { background:var(--kc-accent); filter:brightness(.92); }
    .kc-food-mobile .kc-mobile-hero-text p { width:319px; height:54px; margin:0; }

    .kc-food-mobile > #kc-food-mobile-serving { height:186px; }
    .kc-food-mobile > #kc-food-mobile-facts { height:389px; gap:16px; }
    .kc-food-mobile > #kc-food-mobile-ingredients { height:142px; }
    .kc-food-mobile .kc-mobile-miscellaneous-serving-size__circle { background:var(--kc-accent-soft); justify-content:flex-start; }
    .kc-food-mobile .kc-mobile-miscellaneous-serving-size__circle:nth-child(-n+2) { justify-content:center; }
    .kc-food-mobile .kc-mobile-miscellaneous-serving-size__circle .kc-m-bold { color:var(--kc-gray-1); }
    .kc-food-mobile .kc-mobile-miscellaneous-serving-size__circle .kc-m-foot { color:var(--kc-gray-1); }
    .kc-food-mobile .kc-food-mobile-facts__row { display:flex; width:328px; gap:20px; align-items:flex-start; }
    .kc-food-mobile .kc-food-mobile-facts__row--first { height:190px; }
    .kc-food-mobile .kc-food-mobile-facts__row--second { height:151px; align-items:center; }
    .kc-food-mobile .kc-food-mobile-facts__col { display:flex; width:203px; height:190px; flex:none; flex-direction:column; gap:16px; }
    .kc-food-mobile .kc-food-mobile-facts__col p { display:flex; width:203px; align-items:center; margin:0; color:var(--kc-gray-1); font-size:14px; line-height:18px; letter-spacing:var(--kc-ls); }
    .kc-food-mobile .kc-food-mobile-facts__col p:first-child { height:94px; }
    .kc-food-mobile .kc-food-mobile-facts__col p:last-child { height:63px; }
    .kc-food-mobile .kc-food-mobile-facts__col .kc-m-divider { width:203px; height:1px; }
    .kc-food-mobile .kc-food-mobile-facts__side { display:flex; width:167px; height:151px; flex:none; flex-direction:column; gap:16px; }
    .kc-food-mobile .kc-food-mobile-facts__side p { display:flex; width:167px; height:134px; align-items:center; margin:0; color:var(--kc-gray-1); font-size:14px; line-height:18px; letter-spacing:var(--kc-ls); text-align:right; }
    .kc-food-mobile .kc-food-mobile-facts__side .kc-m-divider { width:167px; height:1px; }
    .kc-food-mobile .kc-food-mobile-facts__img-1 { width:104px; height:163px; }
    .kc-food-mobile .kc-food-mobile-facts__img-2 { width:140px; height:93px; }
    .kc-food-mobile .kc-module-title h3 { text-transform:none; }
    .kc-food-mobile .kc-mobile-image-list-ingredients__item .kc-m-bold { color:var(--kc-gray-1); }
    .kc-food-mobile .kc-mobile-text-list-attribution { height:auto; }

    .kc-food-mobile > .kc-card-more .kc-module--mobile { margin-top:-1px; }
    .kc-food-mobile .kc-module--mobile { border-radius:0; }
    .kc-food-mobile .kc-module--mobile[hidden] { display:none !important; }
    .kc-food-mobile .kc-module--card-last { border-radius:0 0 6px 6px; }
    .kc-food-mobile > .kc-mobile-expansion-see-more { margin-top:-1px; }
    .kc-food-mobile .kc-mobile-expansion-see-more__circle { background:var(--kc-accent); color:var(--kc-white); }
    .kc-food-mobile .kc-mobile-expansion-see-more__circle svg { position:absolute; top:13px; left:12px; display:block; width:16px; height:16px; }
    .kc-food-mobile .kc-mobile-expansion-see-more:active { transform:scale(.98); }
    .kc-food-mobile .kc-mobile-expansion-see-more:focus-visible { outline:2px solid #272320; outline-offset:2px; }
    @media (prefers-reduced-motion: reduce) { .kc-food-mobile * { transition:none !important; } }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <h1 class="kc-card-board-label">Food — Mobile</h1>
      <div class="kc-full-knowledge-card kc-food-mobile-frame" data-kc="Full Knowledge Card">
        <article class="kc-card-stack kc-mobile-designer-card kc-food-mobile kc-theme-orange" data-kc="Segment / Food" aria-label="Pizza Margherita knowledge card">
          <kc-hero entity="food" platform="mobile"></kc-hero>

          <kc-module entity="food" platform="mobile" index="0"></kc-module>

          <kc-module entity="food" platform="mobile" index="1"></kc-module>

          <kc-module entity="food" platform="mobile" index="2"></kc-module>

          <div class="kc-card-more" id="kc-food-mobile-more" hidden>
            <kc-module entity="food" platform="mobile" index="3"></kc-module>
          </div>
          <button class="kc-mobile-expansion-see-more" type="button" data-kc="Mobile / Expansion / See more" aria-expanded="false" aria-controls="kc-food-mobile-more">
            <span class="kc-mobile-expansion-see-more__line" aria-hidden="true"></span>
            <span class="kc-mobile-expansion-see-more__circle" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.14645 5.14645C3.34171 4.95118 3.65829 4.95118 3.85355 5.14645L8 9.29289L12.1464 5.14645C12.3417 4.95118 12.6583 4.95118 12.8536 5.14645C13.0488 5.34171 13.0488 5.65829 12.8536 5.85355L8.35355 10.3536C8.15829 10.5488 7.84171 10.5488 7.64645 10.3536L3.14645 5.85355C2.95118 5.65829 2.95118 5.34171 3.14645 5.14645Z" fill="currentColor"/></svg></span>
            <span class="kc-mobile-expansion-see-more__label">See more</span>
          </button>
        </article>
      </div>
    </div>
  </main>
  <script>
    const stack = document.querySelector(".kc-food-mobile");
    const cardExpansion = stack.querySelector(".kc-mobile-expansion-see-more");
    const cardMore = document.getElementById("kc-food-mobile-more");
    const cardExpansionLabel = cardExpansion.querySelector(".kc-mobile-expansion-see-more__label");
    const tablist = stack.querySelector(".kc-mobile-hero-tabs-container");

    function selectTab(tab, focus = false) {
      const tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
      for (const item of tabs) {
        const selected = item === tab;
        item.classList.toggle("kc-mobile-hero-tab--selected", selected);
        item.setAttribute("aria-selected", String(selected));
        item.tabIndex = selected ? 0 : -1;
      }
      if (focus) tab.focus();
    }

    tablist.addEventListener("click", event => {
      const tab = event.target.closest('[role="tab"]');
      if (tab && tablist.contains(tab)) selectTab(tab);
    });
    tablist.addEventListener("keydown", event => {
      const tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
      const activeIndex = tabs.indexOf(document.activeElement);
      const nextIndex = event.key === "ArrowRight" ? (activeIndex + 1) % tabs.length
        : event.key === "ArrowLeft" ? (activeIndex - 1 + tabs.length) % tabs.length
        : event.key === "Home" ? 0
        : event.key === "End" ? tabs.length - 1
        : -1;
      if (nextIndex < 0) return;
      event.preventDefault();
      selectTab(tabs[nextIndex], true);
    });

    cardExpansion.addEventListener("click", () => {
      const expanded = cardExpansion.getAttribute("aria-expanded") !== "true";
      cardMore.hidden = !expanded;
      cardExpansion.setAttribute("aria-expanded", String(expanded));
      cardExpansionLabel.textContent = expanded ? "See less" : "See more";
    });
  </script>
</body>
</html>
