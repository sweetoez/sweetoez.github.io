<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Card hero cards — Desktop</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css">
  <style>
    * { box-sizing:border-box; }
    body { min-width:560px; margin:0; padding:32px 48px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-hero-board-section { margin:0 0 40px; }
    .kc-hero-board-section h2 { margin:0 0 16px; color:var(--kc-black); font-size:20px; font-weight:700; line-height:24px; }
    .kc-hero-board-items { display:flex; flex-direction:column; gap:40px; }
    .kc-hero-board-item { width:max-content; }
    .kc-hero-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; }
  </style>
</head>
<body>
  <main id="kc-hero-board"></main>
  <script>
    const bodyCopy = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut ...";
    const socialItems = [["P", "Photo app"], ["S", "Social app"], ["F", "Friends app"], ["M", "Movie DB"], ["V", "Short video app"]];
    const social = extraClass => `<ul class="kc-hero-social ${extraClass}" data-kc="Social Media">${socialItems.map(([letter, label]) => `<li><a href="#" class="kc-monogram kc-hero-social__badge" aria-label="${label}">${letter}</a></li>`).join("")}</ul>`;
    const shareSmall = extraClass => `<button class="kc-btn-on-image kc-hero-button kc-hero-button--small ${extraClass}" type="button" aria-label="Share"><img src="../assets/icons/ic_fluent_share_16_regular.svg" alt="" aria-hidden="true"></button>`;
    const shareLarge = (extraClass = "") => `<button class="kc-btn-on-image kc-hero-button kc-hero-button--large kc-hero-button--share ${extraClass}" type="button"><img src="../assets/icons/ic_fluent_share_16_regular.svg" alt="" aria-hidden="true"><span class="kc-hero-button__label">Share</span></button>`;
    const allImages = () => `<button class="kc-btn-on-image kc-hero-button kc-hero-button--large kc-hero-button--all-images" type="button"><img src="../assets/icons/ic_fluent_image_multiple_16_regular.svg" alt="" aria-hidden="true"><span class="kc-hero-button__label">All images</span></button>`;
    const topActions = extraClass => `<div class="kc-hero-top-actions ${extraClass}" data-kc="Top Actions">${shareLarge()}${allImages()}</div>`;
    const image = (path, alt, classes) => `<span class="kc-img kc-hero-img ${classes}"><img src="../assets/images/kc/heroes/${path}" alt="${alt}" onerror="this.style.display='none'"></span>`;
    const title = (entity, category, classes) => `<div class="kc-hero-title ${classes}"><h2 class="${classes}__name">${entity}</h2><p class="${classes}__category">${category}</p></div>`;
    const textModule = website => `<div class="${website ? "kc-text-list-website" : "kc-text-list"}"><p class="kc-hero-body">${bodyCopy}</p>${website ? '<div class="kc-hero-website"><span class="kc-hero-website__globe" aria-hidden="true"></span><a href="#">contoso.com</a></div>' : ""}</div>`;

    const variants = [
      {
        set:"Video + Image",
        items:[
          ["Layout=Portrait, Website=No", "portrait", false],
          ["Layout=Portrait, Website=Yes", "portrait", true],
          ["Layout=Square, Website=No", "square", false],
          ["Layout=Square, Website=Yes", "square", true]
        ],
        render:(variant, layout, website) => {
          const thumb = layout === "portrait" ? "video-image-thumb-portrait.jpg" : "video-image-thumb-square.jpg";
          const squareYesComment = layout === "square" && website ? '<!-- Figma extra group "Header" 492x264 left -20 omitted -->' : "";
          return `<article class="kc-hero kc-hero-video-image kc-hero-video-image--${layout}${website ? " kc-hero-video-image--website" : ""}" data-kc="${variant}">
            <div class="kc-hero-header">
              <div class="kc-hero-video-image__band"></div>
              <div class="kc-hero-video-image__image-frame">
                ${image("video-image-main.jpg", "The Long Field still image", "kc-hero-video-image__main")}
                <div class="kc-hero-video-image__gradient"></div>
                ${title("The Long Field", "2024 film", "kc-hero-video-image__title")}
              </div>
              ${image(thumb, "The Long Field poster", "kc-hero-video-image__thumbnail")}
              ${social("kc-hero-video-image__social")}
              ${shareSmall("kc-hero-video-image__share")}
              ${squareYesComment}
            </div>
            ${textModule(website)}
          </article>`;
        }
      },
      {
        set:"Single Image",
        items:[
          ["Layout=Portrait, Website=No", "portrait", false],
          ["Layout=Portrait, Website=Yes", "portrait", true],
          ["Layout=Square, Website=No", "square", false],
          ["Layout=Square, Website=Yes", "square", true],
          ["Layout=Landscape, Website=No", "landscape", false],
          ["Layout=Landscape, Website=Yes", "landscape", true]
        ],
        render:(variant, layout, website) => {
          const imageFile = `single-image-${layout}.jpg`;
          return `<article class="kc-hero kc-hero-single-image kc-hero-single-image--${layout}${website ? " kc-hero-single-image--website" : ""}" data-kc="${variant}">
            <div class="kc-hero-header">
              <div class="kc-hero-single-image__band"></div>
              ${image(imageFile, "Cedar Falls", "kc-hero-single-image__image")}
              ${title("Cedar Falls", "City in Northland", "kc-hero-single-image__title")}
              ${social("kc-hero-single-image__social")}
              ${shareSmall("kc-hero-single-image__share")}
            </div>
            ${textModule(website)}
          </article>`;
        }
      },
      {
        set:"Designer",
        items:[
          ["Style=Non-Cutout, Gradient Direction=Left to Right, Website=No", "non-cutout", "left-to-right", false],
          ["Style=Non-Cutout, Gradient Direction=Left to Right, Website=Yes", "non-cutout", "left-to-right", true],
          ["Style=Cutout, Gradient Direction=Left to Right, Website=No", "cutout", "left-to-right", false],
          ["Style=Cutout, Gradient Direction=Left to Right, Website=Yes", "cutout", "left-to-right", true],
          ["Style=Non-Cutout, Gradient Direction=Top to Bottom, Website=No", "non-cutout", "top-to-bottom", false],
          ["Style=Non-Cutout, Gradient Direction=Top to Bottom, Website=Yes", "non-cutout", "top-to-bottom", true],
          ["Style=Cutout, Gradient Direction=Top to Bottom, Website=No", "cutout", "top-to-bottom", false],
          ["Style=Cutout, Gradient Direction=Top to Bottom, Website=Yes", "cutout", "top-to-bottom", true]
        ],
        render:(variant, style, direction, website) => {
          const imageFile = style === "cutout" ? "designer-cutout.png" : "designer-main.jpg";
          return `<article class="kc-hero kc-hero-designer kc-hero-designer--${style} kc-hero-designer--${direction}${website ? " kc-hero-designer--website" : ""}" data-kc="${variant}">
            <div class="kc-hero-header">
              ${image(imageFile, "Avery Lane", "kc-hero-designer__image")}
              <div class="kc-hero-title kc-hero-designer__title">
                <div class="kc-hero-title__text kc-hero-designer__title__text">
                  <h2 class="kc-hero-designer__title__name">Avery Lane</h2>
                  <p class="kc-hero-designer__title__category">Singer-songwriter</p>
                </div>
              </div>
              ${social("kc-hero-designer__social")}
              ${topActions("kc-hero-designer__actions")}
            </div>
            ${textModule(website)}
          </article>`;
        }
      },
      {
        set:"No Image",
        items:[
          ["Website=No", false],
          ["Website=Yes", true]
        ],
        render:(variant, website) => `<article class="kc-hero kc-hero-no-image${website ? " kc-hero-no-image--website" : ""}" data-kc="${variant}">
          <div class="kc-hero-no-image__frame${website ? " kc-hero-no-image__frame--website" : ""}">
            ${website ? textModule(true) : `<div class="kc-text-list-attribution"><p class="kc-hero-body">${bodyCopy}</p></div>`}
          </div>
          ${shareLarge("kc-hero-no-image__share")}
          ${social("kc-hero-no-image__social")}
        </article>`
      }
    ];

    document.querySelector("#kc-hero-board").innerHTML = variants.map(set => `
      <section class="kc-hero-board-section">
        <h2>${set.set}</h2>
        <div class="kc-hero-board-items">
          ${set.items.map(([variant, ...options]) => `<div class="kc-hero-board-item">
            <p class="kc-hero-board-label">${set.set} / ${variant}</p>
            ${set.render(variant, ...options)}
          </div>`).join("")}
        </div>
      </section>
    `).join("");
  </script>
</body>
</html>
