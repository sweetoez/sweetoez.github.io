<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Knowledge Card — Mobile</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/media.js"></script>
  <script src="../assets/js/components/kc-modules/travel-map.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <script src="../assets/js/components/kc-card.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; }
    .kc-city-mobile-frame { height:auto; min-height:1813px; padding-bottom:109px; }
    .kc-city-mobile { position:relative; top:auto; left:auto; width:360px; margin:280px 0 0 403px; }
    .kc-city-mobile .kc-mobile-designer--website { height:424px; }
    .kc-city-mobile .kc-mobile-hero-text-list { height:212px; }
    .kc-city-mobile .kc-mobile-hero-tabs { border-radius:100px 0 0 100px; }
    .kc-city-mobile .kc-mobile-hero-tabs-container { width:max-content; }
    .kc-city-mobile .kc-mobile-hero-tab { width:auto; background:var(--kc-accent-soft); color:var(--kc-accent-foreground, var(--kc-accent)); }
    .kc-city-mobile .kc-mobile-hero-tab:first-child { width:auto; }
    .kc-city-mobile .kc-mobile-hero-tab--selected { background:var(--kc-accent); color:var(--kc-white); }
    .kc-city-mobile .kc-mobile-hero-tab:not(.kc-mobile-hero-tab--selected):hover { background:var(--kc-accent-soft); filter:brightness(.96); }
    .kc-city-mobile .kc-mobile-hero-tab:not(.kc-mobile-hero-tab--selected):active { background:var(--kc-accent-soft); filter:brightness(.92); }
    .kc-city-mobile .kc-mobile-hero-tab--selected:hover { background:var(--kc-accent); filter:brightness(.96); }
    .kc-city-mobile .kc-mobile-hero-tab--selected:active { background:var(--kc-accent); filter:brightness(.92); }
    .kc-city-mobile .kc-mobile-hero-tab:focus-visible { outline:2px solid #272320; outline-offset:2px; }
    .kc-city-mobile .kc-mobile-hero-text { width:344px; height:auto; }
    .kc-city-mobile .kc-mobile-hero-text p { width:319px; height:72px; }
    .kc-city-mobile .kc-mobile-hero-website__globe { background-color:var(--kc-accent); }
    .kc-city-mobile .kc-mobile-hero-website a { color:var(--kc-accent-foreground, var(--kc-accent)); }
    .kc-city-mobile .kc-mobile-designer__top-actions img, .kc-city-mobile .kc-mobile-designer__top-actions svg { width:12px; height:12px; }
    .kc-city-mobile .kc-btn-on-image:active, .kc-city-mobile .kc-btn-outline:active, .kc-city-mobile .kc-mobile-expansion-see-more:active, .kc-city-mobile .kc-btn-flipper:active { transform:scale(.98); }
    .kc-city-mobile .kc-btn-on-image:focus-visible, .kc-city-mobile .kc-btn-outline:focus-visible, .kc-city-mobile .kc-btn-reset:focus-visible,
    .kc-city-mobile .kc-btn-flipper:focus-visible, .kc-city-mobile .kc-mobile-expansion-see-more:focus-visible { outline:2px solid #272320; outline-offset:2px; }
    .kc-city-mobile > .kc-module--mobile + .kc-module--mobile, .kc-city-mobile > .kc-card-more .kc-module--mobile { margin-top:-1px; }
    .kc-city-mobile .kc-module--mobile { border-radius:0; }
    .kc-city-mobile .kc-module--mobile[hidden] { display:none !important; }
    .kc-city-mobile .kc-module--card-last { border-radius:0 0 6px 6px; }
    .kc-city-mobile > .kc-mobile-designer--card-last .kc-mobile-hero-text-list { border-radius:0 0 6px 6px; }
    .kc-city-mobile .kc-mobile-text-list-quick-facts { height:186px; }
    .kc-city-mobile .kc-mobile-text-list-quick-facts__more svg { display:block; width:12px; height:12px; flex:none; }
    .kc-city-mobile .kc-mobile-miscellaneous-map { height:160px; }
    .kc-city-mobile .kc-mobile-miscellaneous-travel { height:90px; }
    .kc-city-mobile .kc-mobile-miscellaneous-visit-times { height:168px; }
    .kc-city-mobile .kc-mobile-miscellaneous-visit-times .kc-module-title h3 { text-transform:none; }
    .kc-city-mobile .kc-mobile-miscellaneous-visit-times__bar { background:linear-gradient(180deg,#009BDE 0%,var(--kc-accent) 100%); }
    .kc-city-mobile .kc-mobile-videos-landscape { height:313px; overflow:hidden; }
    .kc-city-mobile .kc-mobile-videos-landscape .kc-module-title h3 { text-transform:none; }
    .kc-city-mobile .kc-module--mobile.kc-mobile-videos-landscape .kc-mobile-videos-landscape__row { width:360px; margin-left:-16px; padding:0 0 0 16px; gap:8px; grid-auto-columns:240px; scroll-padding-left:16px; }
    .kc-city-mobile .kc-mobile-videos-landscape__row > * { justify-self:start; }
    .kc-city-mobile .kc-mobile-videos-landscape__row:focus-visible { outline:2px solid #272320; outline-offset:-2px; }
    .kc-city-mobile .kc-mobile-videos-landscape__previous { position:absolute; z-index:2; top:141px; left:8px; }
    .kc-city-mobile .kc-mobile-videos-landscape__next { position:absolute; z-index:2; top:141px; right:8px; left:auto; }
    .kc-city-mobile .kc-mobile-video__play svg { width:24px; height:24px; color:var(--kc-white); }
    .kc-city-mobile .kc-mobile-video__title--one-line { height:18px; }
    .kc-city-mobile .kc-mobile-expansion-see-more { margin-top:-1px; }
    .kc-city-mobile .kc-mobile-expansion-see-more__circle { background:var(--kc-accent); color:var(--kc-white); }
    .kc-city-mobile .kc-mobile-expansion-see-more__circle svg { position:absolute; top:13px; left:12px; display:block; width:16px; height:16px; }
    .kc-city-mobile .kc-mobile-text-list-attribution { height:79px; }
  </style>
  <script src="../assets/js/kc-mobile-carousels.js" defer></script>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <h1 class="kc-card-board-label">City — Mobile</h1>
      <div class="kc-full-knowledge-card kc-city-mobile-frame" data-kc="Full Knowledge Card">
        <kc-card entity="city" platform="mobile"></kc-card>
      </div>
    </div>
  </main>

</body>
</html>
