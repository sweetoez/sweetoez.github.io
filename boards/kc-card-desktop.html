<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Knowledge Card — Desktop</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script>  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/travel-map.js"></script>
  <script src="../assets/js/components/kc-modules/utility.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <script src="../assets/js/components/kc-card.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:1344px; margin:0; padding:32px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    .kc-card-board-item { width:max-content; }
    .kc-card-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; font-weight:400; line-height:16px; }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <div class="kc-card-board-item">
      <h1 class="kc-card-board-label">Full Knowledge Card</h1>
      <div class="kc-full-knowledge-card" data-kc="Full Knowledge Card">
        <kc-card variant="cardDesktop"></kc-card>

        <form class="kc-modules-panel" data-portfolio="Modules panel (not in Figma)" aria-label="Modules">
          <h2>Modules</h2>
          <p class="kc-modules-panel__hero">Designer (hero) — always on top</p>
          <ol>
            <li>
              <input type="checkbox" checked id="kc-toggle-travel" aria-controls="kc-mod-travel">
              <label for="kc-toggle-travel">Miscellaneous / Travel</label>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Miscellaneous / Travel up" data-move="up"><img src="../assets/icons/ic_fluent_arrow_up_16_regular.svg" alt="" aria-hidden="true"></button>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Miscellaneous / Travel down" data-move="down"><img src="../assets/icons/ic_fluent_arrow_down_16_regular.svg" alt="" aria-hidden="true"></button>
            </li>
            <li>
              <input type="checkbox" checked id="kc-toggle-places" aria-controls="kc-mod-places">
              <label for="kc-toggle-places">Image List / Places to Visit</label>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Image List / Places to Visit up" data-move="up"><img src="../assets/icons/ic_fluent_arrow_up_16_regular.svg" alt="" aria-hidden="true"></button>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Image List / Places to Visit down" data-move="down"><img src="../assets/icons/ic_fluent_arrow_down_16_regular.svg" alt="" aria-hidden="true"></button>
            </li>
            <li>
              <input type="checkbox" checked id="kc-toggle-main" aria-controls="kc-mod-main">
              <label for="kc-toggle-main">Image List / Main</label>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Image List / Main up" data-move="up"><img src="../assets/icons/ic_fluent_arrow_up_16_regular.svg" alt="" aria-hidden="true"></button>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Image List / Main down" data-move="down"><img src="../assets/icons/ic_fluent_arrow_down_16_regular.svg" alt="" aria-hidden="true"></button>
            </li>
            <li>
              <input type="checkbox" checked id="kc-toggle-quote" aria-controls="kc-mod-quote">
              <label for="kc-toggle-quote">Miscellaneous / Quote</label>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Miscellaneous / Quote up" data-move="up"><img src="../assets/icons/ic_fluent_arrow_up_16_regular.svg" alt="" aria-hidden="true"></button>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Miscellaneous / Quote down" data-move="down"><img src="../assets/icons/ic_fluent_arrow_down_16_regular.svg" alt="" aria-hidden="true"></button>
            </li>
            <li>
              <input type="checkbox" checked id="kc-toggle-critics" aria-controls="kc-mod-critics">
              <label for="kc-toggle-critics">Reviews / Critics</label>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Reviews / Critics up" data-move="up"><img src="../assets/icons/ic_fluent_arrow_up_16_regular.svg" alt="" aria-hidden="true"></button>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Reviews / Critics down" data-move="down"><img src="../assets/icons/ic_fluent_arrow_down_16_regular.svg" alt="" aria-hidden="true"></button>
            </li>
            <li>
              <input type="checkbox" checked id="kc-toggle-attribution" aria-controls="kc-mod-attribution">
              <label for="kc-toggle-attribution">Text List / Attribution</label>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Text List / Attribution up" data-move="up"><img src="../assets/icons/ic_fluent_arrow_up_16_regular.svg" alt="" aria-hidden="true"></button>
              <button class="kc-btn-outline kc-btn-outline-icon" type="button" aria-label="Move Text List / Attribution down" data-move="down"><img src="../assets/icons/ic_fluent_arrow_down_16_regular.svg" alt="" aria-hidden="true"></button>
            </li>
          </ol>
          <p class="kc-modules-panel__status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>
  <script>
    const stack = document.querySelector(".kc-card-stack");
    const panel = document.querySelector(".kc-modules-panel");
    const rows = Array.from(panel.querySelectorAll("li"));
    const modules = new Map(rows.map(row => {
      const checkbox = row.querySelector('input[type="checkbox"]');
      return [row, document.getElementById(checkbox.getAttribute("aria-controls"))];
    }));
    const status = panel.querySelector(".kc-modules-panel__status");
    const hero = stack.querySelector(".kc-hero-designer");

    function sync() {
      for (const [row, module] of modules) {
        module.hidden = !row.querySelector('input[type="checkbox"]').checked;
      }

      const orderedRows = Array.from(panel.querySelectorAll("li"));
      orderedRows.forEach((row, index) => {
        row.querySelector('[data-move="up"]').disabled = index === 0;
        row.querySelector('[data-move="down"]').disabled = index === orderedRows.length - 1;
      });

      const cardModules = Array.from(stack.querySelectorAll(":scope > .kc-module"));
      cardModules.forEach(module => module.classList.remove("kc-module--card-last"));
      const lastVisible = cardModules.filter(module => !module.hidden).at(-1);
      hero.classList.toggle("kc-hero-designer--card-last", !lastVisible);
      lastVisible?.classList.add("kc-module--card-last");
    }

    for (const row of rows) {
      const checkbox = row.querySelector('input[type="checkbox"]');
      const module = modules.get(row);
      checkbox.addEventListener("change", sync);

      row.querySelectorAll("[data-move]").forEach(button => {
        button.addEventListener("click", event => {
          const direction = button.dataset.move;
          const neighbor = direction === "up" ? row.previousElementSibling : row.nextElementSibling;
          if (!neighbor) return;

          if (direction === "up") {
            panel.querySelector("ol").insertBefore(row, neighbor);
            stack.insertBefore(module, module.previousElementSibling);
          } else {
            panel.querySelector("ol").insertBefore(neighbor, row);
            stack.insertBefore(modules.get(neighbor), module); /* #053 */
          }

          const orderedRows = Array.from(panel.querySelectorAll("li"));
          const position = orderedRows.indexOf(row) + 1;
          status.textContent = `${row.querySelector("label").textContent} moved to position ${position} of ${orderedRows.length}`;
          sync();

          const focusedButton = event.currentTarget;
          if (focusedButton.disabled) {
            row.querySelector(`[data-move="${direction === "up" ? "down" : "up"}"]:not(:disabled)`).focus();
          } else {
            focusedButton.focus();
          }
        });
      });
    }

    sync();
  </script>
</body>
</html>
