<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSN shell scenarios</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css?v=5">
  <link rel="stylesheet" href="../assets/css/kc-components.css">
  <link rel="stylesheet" href="../assets/css/msn-shell.css">
  <link rel="stylesheet" href="../assets/css/edge-chrome.css">
  <link rel="stylesheet" href="../assets/css/bing-serp.css">
  <link rel="stylesheet" href="../assets/css/windows-desktop.css">
  <link rel="stylesheet" href="../assets/css/windows-shell.css">

  <script src="../assets/js/data/msn-content.js"></script>
  <script src="../assets/js/components/msn-taskbar.js"></script>
  <script src="../assets/js/components/windows-wallpaper.js"></script>
  <script src="../assets/js/components/edge-chrome.js"></script>
  <script src="../assets/js/data/kc-entities.js"></script>
  <script src="../assets/js/components/kc-module.js"></script>
  <script src="../assets/js/components/kc-modules/text-list.js"></script>
  <script src="../assets/js/components/kc-modules/image-list.js"></script>
  <script src="../assets/js/components/kc-modules/travel-map.js"></script>
  <script src="../assets/js/components/kc-modules/media.js"></script>
  <script src="../assets/js/components/kc-modules/utility.js"></script>
  <script src="../assets/js/components/kc-hero.js"></script>
  <script src="../assets/js/components/kc-card.js"></script>
  <script src="../assets/js/dev/kc-theme-audit.js"></script>
  <script src="../assets/js/data/bing-content.js"></script>
  <script src="../assets/js/components/bing-serp.js"></script>
  <script src="../assets/js/dev/bing-spec-check.js"></script>
  <script src="../assets/js/components/phone-frame.js"></script>
  <script src="../assets/js/components/ntp-composer.js"></script>
  <script src="../assets/js/components/ntp-shortcuts.js"></script>
  <script src="../assets/js/components/msn-card.js"></script>
  <script defer src="../assets/js/msn-shell.js?v=135"></script>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css?v=2">
  <script defer src="../assets/js/fluent-motion.js"></script>
  <script defer src="../assets/js/digest.js?v=3"></script>

</head>
<body class="demo">
  <main class="shell-app">
    <header class="shell-controls" aria-label="Demo controls">
      <div class="control-group" role="group" aria-label="Scenario">
        <span class="control-label">Scenario</span>
        <div class="segmented-control">
          <button type="button" data-scenario="edge" aria-pressed="true">Edge new tab page</button>
          <button type="button" data-scenario="bing" aria-pressed="false">Bing</button>
          <button type="button" data-scenario="prong" aria-pressed="false">Windows panel (Prong 2)</button>
        </div>
      </div>

      <div class="control-group bing-entity-control" role="group" aria-label="Knowledge card entity">
        <label class="control-label" for="bing-entity">Entity</label>
        <select id="bing-entity"></select>
      </div>

      <div class="control-group bing-platform-control" role="group" aria-label="Bing platform">
        <span class="control-label">View</span>
        <div class="segmented-control">
          <button type="button" data-bing-platform="desktop" aria-pressed="true">Desktop</button>
          <button type="button" data-bing-platform="mobile" aria-pressed="false">Mobile</button>
        </div>
      </div>

      <div class="control-group" role="group" aria-label="Theme">
        <span class="control-label">Theme</span>
        <div class="segmented-control">
          <button type="button" data-theme-choice="light" aria-pressed="true">Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>
      </div>

      <div class="edge-width-controls" aria-label="Edge window width">
        <div class="width-presets" role="group" aria-label="Width presets">
          <button type="button" data-width="1978" aria-pressed="true">1978 · 4 col</button>
          <button type="button" data-width="1447" aria-pressed="false">1447 · 3 col</button>
          <button type="button" data-width="979" aria-pressed="false">979 · 2 col</button>
          <button type="button" data-width="663" aria-pressed="false">663 · 1 col</button>
        </div>
        <label class="width-slider">
          <span>Width</span>
          <input id="edge-width" type="range" min="320" max="1978" step="1" value="1978">
          <output id="edge-width-readout" for="edge-width">1978 px</output>
        </label>
      </div>
    </header>

    <div class="preview-stage">
      <div class="desktop-fit">
        <section class="desktop-canvas win-desktop" aria-label="Windows desktop">
          <windows-wallpaper></windows-wallpaper>

          <section class="edge-window" aria-label="Edge new tab page">
            <edge-chrome></edge-chrome>
            <iframe class="edge-page" src="msn-ntp-layout.html?embed=1&amp;theme=light&amp;v=135" title="Edge new tab page content"></iframe>
            <div class="bing-desktop-slot">
              <bing-serp entity="company" platform="desktop"></bing-serp>
            </div>
          </section>

          <msn-taskbar></msn-taskbar>
        </section>
      </div>
      <div class="mobile-fit">
        <div class="mobile-canvas">
          <phone-frame id="bing-phone" url="bing.com"></phone-frame>
        </div>
      </div>
    </div>
    <iframe class="windows-panel-preview" src="windows-panel-shell.html?embed=1&amp;theme=light&amp;v=135" title="Windows panel"></iframe>
  </main>

</body>
</html>
