<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSN shell scenarios</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/msn-shell.css">
  <link rel="stylesheet" href="../assets/css/edge-chrome.css">

  <script defer src="../assets/js/msn-shell.js"></script>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
  <script defer src="../assets/js/digest.js"></script>

</head>
<body class="demo">
  <main class="shell-app">
    <header class="shell-controls" aria-label="Demo controls">
      <div class="control-group" role="group" aria-label="Scenario">
        <span class="control-label">Scenario</span>
        <div class="segmented-control">
          <button type="button" data-scenario="edge" aria-pressed="true">Edge new tab page</button>
          <button type="button" data-scenario="prong" aria-pressed="false">Windows panel (Prong 2)</button>
        </div>
      </div>

      <div class="control-group" role="group" aria-label="Theme">
        <span class="control-label">Theme</span>
        <div class="segmented-control">
          <button type="button" data-theme-choice="light" aria-pressed="true">Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>
      </div>

      <div class="edge-width-controls" aria-label="Edge window width">
        <div class="width-presets" role="group" aria-label="Width presets">
          <button type="button" data-width="1978" aria-pressed="true">1978 · 4 col</button>
          <button type="button" data-width="1447" aria-pressed="false">1447 · 3 col</button>
          <button type="button" data-width="979" aria-pressed="false">979 · 2 col</button>
          <button type="button" data-width="663" aria-pressed="false">663 · 1 col</button>
        </div>
        <label class="width-slider">
          <span>Width</span>
          <input id="edge-width" type="range" min="320" max="1978" step="1" value="1978">
          <output id="edge-width-readout" for="edge-width">1978 px</output>
        </label>
      </div>
    </header>

    <div class="desktop-fit">
      <section class="desktop-canvas" aria-label="Windows desktop">
        <div class="desktop-wallpaper">
          <img src="../assets/images/msn/shell/wallpaper-light.jpg" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'">
        </div>

        <section class="edge-window" aria-label="Edge new tab page">
          <div class="edge-chrome-row edge-tab-row">
            <div class="edge-active-tab">
              <img src="../assets/icons/globe_16_regular.svg" alt="" aria-hidden="true">
              <span>New tab</span>
              <button class="edge-tab-dismiss" type="button" aria-label="Close tab"><img src="../assets/icons/dismiss_12_regular.svg" alt="" aria-hidden="true"></button>
            </div>
            <div class="edge-window-controls">
              <button type="button" aria-label="Minimize"><img src="../assets/icons/subtract_16_regular.svg" alt="" aria-hidden="true"></button>
              <button type="button" aria-label="Maximize"><img src="../assets/icons/square_16_regular.svg" alt="" aria-hidden="true"></button>
              <button type="button" aria-label="Close window"><img src="../assets/icons/dismiss_16_regular.svg" alt="" aria-hidden="true"></button>
            </div>
          </div>
          <div class="edge-chrome-row edge-toolbar">
            <div class="edge-navigation-icons">
              <button type="button" aria-label="Back"><img src="../assets/icons/arrow_left_20_regular.svg" alt="" aria-hidden="true"></button>
              <button type="button" aria-label="Reload"><img src="../assets/icons/arrow_clockwise_20_regular.svg" alt="" aria-hidden="true"></button>
              <button type="button" aria-label="Home"><img src="../assets/icons/home_20_regular.svg" alt="" aria-hidden="true"></button>
            </div>
            <div class="edge-address">Search or enter web address</div>
            <button type="button" aria-label="Favorites"><img src="../assets/icons/star_20_regular.svg" alt="" aria-hidden="true"></button>
            <button type="button" aria-label="More options"><img src="../assets/icons/more_horizontal_20_regular.svg" alt="" aria-hidden="true"></button>
          </div>
          <div class="edge-chrome-row edge-favorites" aria-label="Favorites">
            <div class="edge-favorite"><span class="edge-favorite__icon"></span><span class="edge-favorite__label">News</span></div>
            <div class="edge-favorite"><span class="edge-favorite__icon"></span><span class="edge-favorite__label">Weather</span></div>
            <div class="edge-favorite"><span class="edge-favorite__icon"></span><span class="edge-favorite__label">Money</span></div>
            <div class="edge-favorite"><span class="edge-favorite__icon"></span><span class="edge-favorite__label">Sports</span></div>
            <div class="edge-favorite"><span class="edge-favorite__icon"></span><span class="edge-favorite__label">Shopping</span></div>
          </div>
          <iframe class="edge-page" src="msn-ntp-layout.html?embed=1&amp;theme=light" title="Edge new tab page content"></iframe>
        </section>

        <div class="taskbar" aria-label="Windows taskbar">
          <div class="taskbar-apps" aria-hidden="true">
            <span class="taskbar-slot"><span class="taskbar-item"></span></span><span class="taskbar-slot"><span class="taskbar-item"></span></span><span class="taskbar-slot"><span class="taskbar-item"></span></span>
            <span class="taskbar-slot"><span class="taskbar-item"></span></span><span class="taskbar-slot"><span class="taskbar-item"></span></span><span class="taskbar-slot"><span class="taskbar-item"></span></span>
          </div>
          <div class="taskbar-clock"><span>10:30 AM</span><span>11/17/2026</span></div>
        </div>
      </section>
    </div>
    <iframe class="windows-panel-preview" src="windows-panel-shell.html?embed=1&amp;theme=light" title="Windows panel"></iframe>
  </main>

</body>
</html>
