<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KC Hero Cards — Mobile</title>
  <link rel="stylesheet" href="../assets/css/msn-components.css">
  <link rel="stylesheet" href="../assets/css/kc-components.css"><script src="../assets/js/data/kc-entities.js"></script><script src="../assets/js/components/kc-hero.js"></script>
  <style>
    * { box-sizing:border-box; }
    body { min-width:560px; margin:0; padding:32px 48px; background:var(--kc-gray-5); color:var(--kc-gray-1); font-family:var(--kc-font); }
    main { width:max-content; }
    h1 { margin:0 0 24px; color:var(--kc-black); font-size:24px; font-weight:600; line-height:30px; }
    .kc-hero-board-section { margin:0 0 40px; }
    .kc-hero-board-section h2 { margin:0 0 16px; color:var(--kc-black); font-size:20px; font-weight:600; line-height:24px; }
    .kc-hero-board-items { display:flex; flex-direction:column; gap:40px; }
    .kc-hero-board-item { width:max-content; }
    .kc-hero-board-label { margin:0 0 8px; color:var(--kc-gray-2); font-size:12px; line-height:16px; }
  </style>
  <link rel="stylesheet" href="../assets/css/fluent-motion.css">
  <script defer src="../assets/js/fluent-motion.js"></script>
</head>
<body class="demo">
  <main>
    <h1>KC Hero Cards — Mobile</h1>
    <section class="kc-hero-board-section">
      <h2>Mobile / Designer</h2>
      <div class="kc-hero-board-items" id="designer-items"></div>
    </section>
    <section class="kc-hero-board-section">
      <h2>Mobile / Single Image</h2>
      <div class="kc-hero-board-items" id="single-image-items"></div>
    </section>
  </main>
  <script>
    const samples = window.KC_ENTITIES._samples.heroes.mobile;

    function renderSamples(containerId, kind) {
      document.querySelector(`#${containerId}`).innerHTML = samples
        .filter(sample => sample.kind === kind)
        .map(sample => `<div class="kc-hero-board-item">
          <p class="kc-hero-board-label">${sample.label}</p>
          <kc-hero platform="mobile" variant="${sample.id}"></kc-hero>
        </div>`)
        .join("");
    }

    renderSamples("designer-items", "designer");
    renderSamples("single-image-items", "single-image");
  </script>
</body>
</html>
